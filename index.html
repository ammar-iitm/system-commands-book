<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navigating Linux — Interactive Book</title>
<style>:root{
  --bg:#f6f4ef;--panel:#ffffff;--ink:#1d2330;--ink2:#566074;--line:#e3dfd5;--accent:#4a7c6f;--accent2:#3b6ea5;--accent-soft:#e6f1ec;
  --code-bg:#f1eee6;--term-bg:#10141c;--term-ink:#d7e0ee;--term-prompt:#7ee0a8;--term-dir:#7aa7ff;--term-err:#ff8b8b;
  --ok:#15803d;--bad:#b91c1c;--shadow:0 1px 2px rgba(20,20,20,.06),0 8px 24px rgba(20,20,20,.06);
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="reading"]){
  --bg:#12151c;--panel:#1a1f29;--ink:#e8ebf2;--ink2:#9aa5b8;--line:#2b3240;--accent:#8fcfb5;--accent2:#8db7e8;--accent-soft:#1c2b27;--code-bg:#232a37;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#12151c;--panel:#1a1f29;--ink:#e8ebf2;--ink2:#9aa5b8;--line:#2b3240;--accent:#8fcfb5;--accent2:#8db7e8;--accent-soft:#1c2b27;--code-bg:#232a37;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code,kbd,pre{font-family:var(--mono)}
code{background:var(--code-bg);padding:.12em .38em;border-radius:5px;font-size:.88em}
kbd{background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:.05em .4em;font-size:.82em}
button{font:inherit;cursor:pointer;color:inherit}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:700;font-size:1.15rem;letter-spacing:.2px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand small{font:500 .72rem var(--sans);color:var(--ink2);display:block;letter-spacing:.3px}
.spacer{flex:1}
.pill,.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:.88rem;display:inline-flex;align-items:center;gap:8px;color:var(--ink2)}
.pill:hover,.iconbtn:hover{border-color:var(--accent);color:var(--ink)}
.iconbtn{padding:6px 10px}
.searchbtn{min-width:220px;justify-content:space-between}
#menuBtn{display:none}
.layout{display:grid;grid-template-columns:276px minmax(0,1fr);max-width:1500px;margin:0 auto}
.side{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;padding:18px 14px 120px;border-right:1px solid var(--line)}
.side h6{margin:18px 10px 6px;font:700 .7rem var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2)}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink);font-size:.93rem;line-height:1.3}
.nav a:hover{background:var(--code-bg);text-decoration:none}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 .72rem var(--sans);background:var(--code-bg);color:var(--ink2);flex:none}
.nav a.done .n{background:var(--ok);color:#fff}
.nav .wk{margin-left:auto;font-size:.68rem;color:var(--ink2);white-space:nowrap}
.ring{margin:6px 10px 2px;height:8px;border-radius:99px;background:var(--code-bg);overflow:hidden}.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s}
.ringtxt{margin:0 10px;font-size:.78rem;color:var(--ink2)}
main{padding:34px clamp(18px,4vw,56px) 140px;min-width:0}
.page{max-width:900px;margin:0 auto}
.page.wide{max-width:1100px}
.eyebrow{font:700 .74rem var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-size:clamp(2rem,4vw,2.9rem);line-height:1.12;margin:.2em 0 .3em;letter-spacing:-.4px}
h2{font-family:var(--serif);font-size:1.6rem;margin:0 0 .5em;letter-spacing:-.2px}
h3{font-size:1.05rem;margin:1.2em 0 .4em}h4{margin:1em 0 .3em;font-size:.95rem}
.lede{font-size:1.12rem;color:var(--ink2);max-width:62ch}
.hero{padding:6px 0 26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:block;color:var(--ink);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent);text-decoration:none}
.card .ic{font-size:1.6rem}.card b{display:block;margin:4px 0 2px;font-size:1.02rem}.card span{color:var(--ink2);font-size:.86rem;line-height:1.4;display:block}
.card .meta{margin-top:10px;font-size:.74rem;color:var(--ink2);display:flex;gap:10px;align-items:center}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--code-bg);font-size:.72rem;color:var(--ink2)}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 28px;margin:22px 0;box-shadow:var(--shadow);scroll-margin-top:76px}
.sec p{margin:.7em 0}.sec ul,.sec ol{padding-left:1.3em}.sec li{margin:.25em 0}
.t{border-collapse:collapse;width:100%;font-size:.9rem;margin:12px 0;display:block;overflow-x:auto}
.t th,.t td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.t th{background:var(--code-bg);font-weight:600}
pre{margin:12px 0;padding:14px 16px;background:var(--code-bg);border-radius:12px;overflow-x:auto;font-size:.84rem;line-height:1.55;border:1px solid var(--line)}
pre.diagram{white-space:pre}
.callout{border-left:4px solid var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.callout.warn{border-color:var(--accent);background:var(--accent-soft)}
.cta{padding:10px 14px;border-radius:12px;background:var(--accent-soft)}
.vimgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:12px 0}
.vimgrid>div{background:var(--code-bg);border-radius:12px;padding:10px 14px;font-size:.84rem;line-height:1.9}
.vimgrid h4{margin:0 0 2px;font-family:var(--sans);color:var(--accent)}
.cmdtitle{font:700 .72rem var(--sans);letter-spacing:1.1px;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.cmdtitle:after{content:"";height:1px;background:var(--line);flex:1}
.cmdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 12px}
.cmd{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent;text-align:left;background:none;width:100%}
.cmd:hover{background:var(--code-bg);border-color:var(--line)}
.cmd code{white-space:pre-wrap;word-break:break-word;background:transparent;padding:0;color:var(--accent);font-weight:600;flex:0 1 46%}
.cmd span{color:var(--ink2);font-size:.84rem;line-height:1.35;flex:1}
.ex{border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden;background:var(--panel)}
.exhead{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--term-bg);color:var(--term-ink);flex-wrap:wrap}
.exhead code{background:none;color:var(--term-ink);padding:0;flex:1 1 280px;white-space:pre-wrap;word-break:break-word}
.exhead code:before{content:"$ ";color:var(--term-prompt)}
.exhead .note{font:.76rem var(--sans);color:#8b97ad}
.exhead button{background:#223;border:1px solid #38425a;color:#cfe;border-radius:8px;padding:3px 10px;font-size:.78rem}
.exhead button:hover{border-color:var(--term-prompt)}
.exout{margin:0;border:0;border-radius:0;background:#0b0e14;color:var(--term-ink);white-space:pre-wrap;word-break:break-word}
.exout .e{color:var(--term-err)}
.quiz{margin-top:28px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.q p{margin:0 0 10px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;transition:border-color .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.why{margin-top:10px;font-size:.88rem;color:var(--ink2)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.07)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{font-family:var(--serif);font-size:1.6rem}
.toc{position:fixed;right:max(14px,calc((100vw - 1500px)/2 + 14px));top:96px;width:190px;font-size:.8rem;display:none}
@media(min-width:1380px){.toc{display:block}.page.hasToc{margin-left:max(0px,calc(50% - 450px - 90px))}}
.toc b{display:block;text-transform:uppercase;letter-spacing:1px;font-size:.68rem;color:var(--ink2);margin-bottom:6px}
.toc a{display:block;padding:3px 0 3px 10px;border-left:2px solid var(--line);color:var(--ink2)}
.toc a:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
/* map */
.weeks details{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.weeks summary{cursor:pointer;padding:12px 18px;font-weight:700;display:flex;gap:10px;align-items:center;list-style:none}
.weeks summary::-webkit-details-marker{display:none}
.weeks summary:before{content:"▸";transition:transform .15s;color:var(--accent)}
.weeks details[open]>summary:before{transform:rotate(90deg)}
.lec{padding:6px 18px 14px 30px;border-top:1px dashed var(--line)}
.lec h4{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 6px}
.lec label{font-weight:400;font-size:.8rem;color:var(--ink2);display:flex;gap:5px;align-items:center}
.lec ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px 14px}
.lec li{display:flex;gap:8px;font-size:.86rem;align-items:baseline;padding:2px 0}
.lec li time{font:.74rem var(--mono);color:var(--ink2);flex:none;min-width:42px}
.lec li button{background:none;border:0;text-align:left;padding:0;color:inherit;font:inherit}
.lec li button:hover{color:var(--accent)}
.search-in{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;margin:8px 0 14px}
.search-in:focus,input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
/* flashcards */
.fc-wrap{display:grid;place-items:center;margin:18px 0}
.fc{perspective:1200px;width:min(560px,100%);height:260px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;padding:26px;text-align:center}
.fc-front{background:var(--term-bg);color:var(--term-ink)}
.fc-front code{background:none;font-size:1.25rem;color:var(--term-prompt);word-break:break-word;white-space:pre-wrap}
.fc-back{background:var(--panel);transform:rotateY(180deg);font-size:1.15rem;font-family:var(--serif)}
.fc small{position:absolute;top:12px;left:16px;font:600 .7rem var(--sans);letter-spacing:1px;text-transform:uppercase;opacity:.6}
/* playground */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;font-size:.9rem}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.pg{grid-template-columns:1fr}}
.pg label{display:block;font:700 .7rem var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--ink2);margin:10px 0 4px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px;font:.88rem var(--mono)}
textarea{min-height:170px;resize:vertical;line-height:1.5}
.out{background:var(--term-bg);color:var(--term-ink);border-radius:12px;padding:12px 14px;min-height:170px;white-space:pre-wrap;word-break:break-word;font:.86rem/1.55 var(--mono);overflow:auto}
.out mark{background:#f59e0b;color:#111;border-radius:3px;padding:0 1px}
.out .e{color:var(--term-err)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 11px;font-size:.78rem;color:var(--ink2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chk{display:inline-flex;gap:4px;align-items:center;margin-right:10px;font-size:.86rem}
/* challenges */
.chal{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.chal.done{border-color:var(--ok)}
.chal .num{width:30px;height:30px;border-radius:50%;background:var(--code-bg);display:grid;place-items:center;font-weight:700;flex:none}
.chal.done .num{background:var(--ok);color:#fff}
.chal p{margin:0 0 6px}.chal details{font-size:.85rem;color:var(--ink2)}
/* cheat */
.cheat{columns:2 420px;column-gap:20px}
.cheat section{break-inside:avoid;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 16px}
.cheat h3{margin:0 0 6px;font-family:var(--serif)}
.cheat table{width:100%;border-collapse:collapse;font-size:.82rem}
.cheat td{padding:3px 6px 3px 0;vertical-align:top;border-bottom:1px dashed var(--line)}
.cheat td:first-child{width:46%}
.cheat td:first-child code{background:none;color:var(--accent);padding:0;white-space:pre-wrap;word-break:break-word}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--term-bg);color:var(--term-ink);border-top:2px solid var(--accent);box-shadow:0 -10px 30px rgba(0,0,0,.25);transform:translateY(calc(100% - 40px));transition:transform .25s;height:min(48vh,420px);display:flex;flex-direction:column}
.dock.open{transform:none}
.dockbar{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;flex:none;font-size:.86rem}
.dockbar b{color:var(--term-prompt);font-family:var(--mono)}
.dockbar .active{background:#26324a;border-radius:99px;padding:2px 12px;font-size:.78rem;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dockbar button{background:#1d2535;border:1px solid #38425a;color:#cfe;border-radius:8px;padding:2px 10px;font-size:.78rem}
.term{flex:1;overflow:auto;padding:6px 16px 10px;font:.86rem/1.5 var(--mono);cursor:text}
.term .l{white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--term-prompt)}.term .d{color:var(--term-dir)}.term .e{color:var(--term-err)}.term .ok{color:#f5d76e}
.tin{display:flex;gap:0;align-items:baseline}
.tin input{flex:1;background:transparent;border:0;color:var(--term-ink);font:inherit;padding:0 0 0 8px;outline:none}
.tchips{padding:4px 14px 8px;display:flex;gap:6px;flex-wrap:wrap;flex:none;border-top:1px solid #222b3a}
.tchips .chip{background:#161d2a;border-color:#2e3a52;color:#9fb0cc;font:.74rem var(--mono)}
/* palette */
.pal{position:fixed;inset:0;z-index:60;background:rgba(10,12,18,.55);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal.open{display:flex}
.palbox{width:min(640px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font:1.05rem var(--sans);background:transparent;color:var(--ink)}
.palbox ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palbox li{padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.palbox li.sel{background:var(--accent-soft)}
.palbox li small{color:var(--ink2);margin-left:auto;font-size:.72rem;white-space:nowrap}
.palbox li code{background:none;padding:0;color:var(--accent)}
.cidr{margin:12px 0;padding:12px 14px;background:var(--code-bg);border-radius:12px;font-size:.88rem}
.cidr input{width:200px;display:inline-block;margin-left:6px;padding:4px 8px}
.cidr output{display:block;margin-top:8px;font-family:var(--mono);font-size:.82rem;line-height:1.7}
.foot{margin-top:50px;font-size:.8rem;color:var(--ink2);border-top:1px solid var(--line);padding-top:16px}
@media(max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:57px;width:290px;background:var(--bg);z-index:35;transform:translateX(-100%);transition:transform .2s;height:calc(100vh - 57px)}
  .side.open{transform:none;box-shadow:var(--shadow)}
  #menuBtn{display:inline-flex}.searchbtn{min-width:0}.searchbtn .lbl{display:none}
  .sec{padding:18px 16px;border-radius:14px}
}
@media print{.topbar,.side,.dock,.toc,.noprint,.pal{display:none!important}.layout{display:block}main{padding:0}body{background:#fff;color:#000}.cheat section,.sec{box-shadow:none}}

body.dockopen main{padding-bottom:min(52vh,460px)}
.page,.sec{min-width:0;max-width:100%}.sec{overflow-wrap:anywhere}.sec pre,.sec .t{overflow-wrap:normal}.cmdgrid{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
@media(max-width:700px){.topbar{gap:6px;padding:8px 10px}.brand{font-size:.95rem}.brand small,.searchbtn kbd{display:none}.brand span:first-child{font-size:1.2rem!important}.pill{padding:6px 10px}#termBtn .lbl{display:none}.searchbtn{min-width:0}main{padding-left:14px;padding-right:14px}}

:root[data-theme="reading"]{--bg:#f4ecd8;--panel:#fbf5e4;--ink:#3b3226;--ink2:#6d6050;--line:#decfae;--accent:#9a3f12;--accent2:#2f6b5e;--accent-soft:#f3e0c4;--code-bg:#ece1c6;--shadow:0 1px 2px rgba(80,60,20,.08),0 6px 18px rgba(80,60,20,.08)}
:root[data-theme="reading"] body{font:19px/1.85 var(--serif)}
:root[data-theme="reading"] .sec p,:root[data-theme="reading"] .sec li,:root[data-theme="reading"] .lede{font-family:var(--serif)}
:root[data-theme="reading"] .page{max-width:760px}
:root[data-theme="reading"] .sec{box-shadow:none;background:transparent;border-color:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:18px 4px}
:root[data-theme="reading"] .toc{display:none}
.themes{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.themes button{border:0;background:none;padding:6px 11px;font-size:.82rem;color:var(--ink2)}
.themes button.on{background:var(--accent);color:#fff}
.wm{position:fixed;inset:0;z-index:1;pointer-events:none;display:grid;place-items:center;overflow:hidden;user-select:none}
.wm span{transform:rotate(-24deg);font:800 clamp(2.4rem,9vw,7.5rem)/1.05 var(--serif);letter-spacing:.04em;color:var(--ink);opacity:.045;text-align:center;white-space:nowrap}
.wm small{display:block;font:600 .22em var(--sans);letter-spacing:.3em;text-transform:uppercase}
.layout,.topbar,.dock{position:relative}.topbar{position:sticky}.dock{position:fixed}
.credit{display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:6px 14px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.88rem}
.foot b{color:var(--ink)}
@media print{.wm span{opacity:.07}}

<script>/* ===== Regex translation (POSIX BRE/ERE -> JS) ===== */
const POSIX = {alpha:'a-zA-Z',digit:'0-9',alnum:'a-zA-Z0-9',upper:'A-Z',lower:'a-z',space:' \\t\\n\\r\\f\\v',blank:' \\t',punct:'!-\\/:-@\\[-`{-~',print:' -~',graph:'!-~',cntrl:'\\x00-\\x1f\\x7f',xdigit:'0-9A-Fa-f'};
function posixToJS(pat, ere) {
  let out = '', i = 0;
  while (i < pat.length) {
    const c = pat[i];
    if (c === '[') {
      let j = i + 1, cls = '[';
      if (pat[j] === '^') { cls += '^'; j++; }
      if (pat[j] === ']') { cls += '\\]'; j++; }
      while (j < pat.length && pat[j] !== ']') {
        if (pat[j] === '[' && pat[j+1] === ':') {
          const e = pat.indexOf(':]', j + 2);
          if (e > 0) { cls += POSIX[pat.slice(j+2, e)] || ''; j = e + 2; continue; }
        }
        if (pat[j] === '\\') cls += '\\\\';
        else if (pat[j] === '[') cls += '\\[';
        else cls += pat[j];
        j++;
      }
      out += cls + ']'; i = j + 1; continue;
    }
    if (c === '\\') {
      const n = pat[i+1]; i += 2;
      if (n === undefined) { out += '\\\\'; break; }
      if (!ere && '(){}|+?'.includes(n)) { out += n; continue; }
      if (n === '<' || n === '>') { out += '\\b'; continue; }
      if ('bBwWsSdD'.includes(n) || /[0-9]/.test(n)) { out += '\\' + n; continue; }
      if (n === 'n') { out += '\\n'; continue; }
      if (n === 't') { out += '\\t'; continue; }
      out += '\\' + n; continue;
    }
    if (!ere && '(){}|+?'.includes(c)) { out += '\\' + c; i++; continue; }
    if (!ere && c === '*' && (out === '' || out.endsWith('(') && !out.endsWith('\\('))) { out += '\\*'; i++; continue; }
    out += c; i++;
  }
  return out;
}
function mkRe(pat, ere, flags) {
  try { return new RegExp(posixToJS(pat, ere), flags || ''); }
  catch (e) { throw new Error('invalid regular expression: ' + pat); }
}

      html: `<p><b>Linux</b> is strictly the <em>kernel</em> — the program that talks to hardware, schedules processes and manages memory. Combined with the GNU tools (the <em>coreutils</em> like <code>ls</code>, <code>cp</code>, <code>cat</code>) and other software, it forms a complete operating system, packaged by a <em>distribution</em> such as Ubuntu, Debian, Fedora or Arch.</p>
      <p>The <b>shell</b> is a program that reads the commands you type, runs them, and prints the result. <b>Bash</b> is the most common one. The <b>terminal</b> is just the window (the "screen and keyboard") that hosts a shell. You can swap the terminal without changing the shell, and vice versa.</p>
      <div class="callout tip"><b>Mental model.</b> Hardware → Kernel → Shell → You. Each layer only talks to its neighbours, like the rings of an onion.</div>
      <p>Why the command line? It is scriptable, repeatable, works over slow SSH links, uses almost no resources and lets you chain small tools into powerful pipelines — the heart of the UNIX philosophy: <em>do one thing well, and combine programs with text streams</em>.</p>`,

      html: `<p>Five commands cover most day-to-day file work. Remember there is <b>no recycle bin</b>: <code>rm</code> is permanent.</p>
      <ul><li><code>touch f</code> creates an empty file (or updates its timestamp).</li><li><code>mkdir d</code> creates a directory; <code>-p</code> creates the whole chain.</li><li><code>cp a b</code> copies; copying a directory needs <code>-r</code>.</li><li><code>mv a b</code> moves <em>or renames</em> — it works on directories without <code>-r</code>.</li><li><code>rm f</code> deletes files; <code>rm -r d</code> deletes directories; <code>rm -i</code> asks first; <code>rmdir</code> only removes empty directories.</li></ul>`,
      cmds: [['touch file', 'Create an empty file / update timestamps'], ['mkdir dir', 'Create a directory'], ['mkdir -p a/b/c', 'Create nested directories'], ['cp src dst', 'Copy a file'], ['cp -r dir newdir', 'Copy a directory recursively'], ['mv old new', 'Rename or move'], ['rm file', 'Delete a file'], ['rm -r dir', 'Delete a directory and its contents'], ['rm -i file', 'Ask before deleting'], ['rmdir dir', 'Remove an empty directory']],
      ex: [{ c: 'mkdir -p lab/week1 && touch lab/week1/a.txt && ls -R lab 2>/dev/null || ls lab/week1', n: 'Build a tree' }, { c: 'cp notes.txt notes.bak; ls', n: 'Backup copy' }, { c: 'cp notes.txt notes.bak; mkdir -p lab; mv notes.bak lab/; ls lab', n: 'Move it into a folder' }, { c: 'mkdir -p lab; rm -r lab; ls', n: 'Clean up' }] },
    { id: 'view', h: 'Looking inside files',
      html: `<p>Pick the viewer to match the job: <code>cat</code> dumps a whole file, <code>head</code>/<code>tail</code> show the start or end, <code>less</code> lets you scroll (press <kbd>q</kbd> to quit; "less is more" — it improves on <code>more</code>), and <code>wc</code> counts lines, words and bytes.</p>
      <p>To find out <em>what a command is</em>: <code>which</code> shows its path, <code>whatis</code> gives a one-liner, <code>type</code> tells whether it is an alias, builtin or program, and <code>file</code> tells whether a file is text or binary.</p>`,
      cmds: [['cat file', 'Print entire file'], ['cat -n file', 'Print with line numbers'], ['head -n 5 file', 'First 5 lines'], ['tail -n 5 file', 'Last 5 lines'], ['less file', 'Scroll through a file (q to quit)'], ['wc -l file', 'Count lines'], ['wc file', 'Lines, words, bytes'], ['file name', 'Detect file type'], ['which cmd', 'Path of a command'], ['type cmd', 'Alias, builtin or file?']],
      ex: [{ c: 'cat -n notes.txt', n: 'Numbered output' }, { c: 'head -n 2 fruits.txt', n: 'First two lines' }, { c: 'tail -n 2 fruits.txt', n: 'Last two lines' }, { c: 'wc -l fruits.txt', n: 'Line count' }, { c: 'file hello.sh', n: 'Detects a shell script' }] },
    { id: 'help', h: 'Getting help',
      html: `<p>You never need to memorise every option. <code>man cmd</code> opens the manual, <code>man -k word</code> (same as <code>apropos word</code>) searches manual summaries, <code>info</code> offers GNU's hyperlinked docs, and <code>help cmd</code> documents shell <em>builtins</em> like <code>cd</code>. Most programs also accept <code>--help</code>.</p>`,
      cmds: [['man cmd', 'Manual page'], ['man -k word', 'Search manual summaries'], ['apropos word', 'Same as man -k'], ['whatis cmd', 'One-line description'], ['help cd', 'Help for shell builtins'], ['info cmd', 'GNU info documentation'], ['cmd --help', 'Quick usage summary']],
      ex: [{ c: 'man grep', n: 'The simulated man pages are short summaries' }, { c: 'type cd', n: 'cd is a shell builtin' }, { c: 'type ll', n: 'An alias' }] },
    { id: 'alias', h: 'Aliases and command types',
      html: `<p>An <b>alias</b> is a nickname for a longer command: <code>alias ll='ls -l'</code>. Remove it with <code>unalias ll</code>. To bypass an alias for one run, escape it: <code>\\ls</code> or give the full path. Aliases typed at the prompt vanish when the shell closes; put them in <code>~/.bashrc</code> to keep them.</p>
      <p>The shell resolves a name in this order: <b>alias → function → builtin → program found via <code>$PATH</code></b>.</p>`,
      cmds: [["alias name='cmd'", 'Create an alias'], ['alias', 'List aliases'], ['unalias name', 'Remove an alias'], ['\\cmd', 'Run the real command, ignoring an alias']],
      ex: [{ c: "alias ll", n: 'Check the existing alias' }, { c: "alias la='ls -a'; la", n: 'Create and use one' }, { c: 'unalias la; type la', n: 'Remove it' }] },
    { id: 'perms', h: 'Permissions: rwx and octal',
      html: `<p>Run <code>ls -l</code> and decode the first column, e.g. <code>-rwxr-x---</code>:</p>
      <pre class="diagram"> -   rwx   r-x   ---
 │    │     │     └─ others (everyone else)
 │    │     └─────── group
 │    └───────────── user (owner)
 └────────────────── type: - file, d directory, l symlink</pre>
      <p>Bits: <b>r</b>=4, <b>w</b>=2, <b>x</b>=1. Add them per class to get <b>octal</b>: <code>rwx</code>=7, <code>r-x</code>=5, <code>r--</code>=4. So <code>chmod 750 f</code> gives owner <code>rwx</code>, group <code>r-x</code>, others nothing.</p>
      <p>On a <em>directory</em>, <b>r</b> lets you list names, <b>w</b> lets you create/delete entries, and <b>x</b> lets you enter it (<code>cd</code>) or access items inside. Symbolic form: <code>chmod g-w f</code>, <code>chmod o-x f</code>, <code>chmod u+x f</code>, <code>chmod a=r f</code>.</p>
      <div class="callout warn"><b>Caveat.</b> Deleting a file needs write permission on its <em>directory</em>, not on the file itself.</div>`,
      cmds: [['chmod 755 f', 'rwxr-xr-x'], ['chmod 700 f', 'Private: only owner can access'], ['chmod 644 f', 'rw-r--r--, typical for text files'], ['chmod u+x f', 'Add execute for owner'], ['chmod g-w f', 'Remove write from group'], ['chmod o-x f', 'Remove execute from others'], ['groups', 'Groups you belong to'], ['id', 'Your user and group IDs']],
      ex: [{ c: 'ls -l hello.sh', n: 'Before' }, { c: 'chmod u+x hello.sh; ls -l hello.sh', n: 'Make executable' }, { c: 'chmod 600 hello.sh; ls -l hello.sh', n: 'Octal form' }, { c: 'chmod 755 hello.sh && ./hello.sh', n: 'Run it' }] },
    { id: 'inode', h: 'Inodes, hard links and soft links',
      html: `<p>A file is really three separate things: its <b>name</b> (stored in the directory), its <b>metadata</b> (permissions, owner, size, timestamps — in an <em>inode</em>), and its <b>data blocks</b>. The inode number identifies the file; names just point to it. See it with <code>ls -i</code> and <code>stat</code>.</p>
      <table class="t"><tr><th></th><th>Hard link <code>ln a b</code></th><th>Soft link <code>ln -s a b</code></th></tr>
      <tr><td>Points to</td><td>The same inode</td><td>A path (text)</td></tr><tr><td>If original deleted</td><td>Still works (data survives until link count = 0)</td><td>Becomes <em>dangling</em></td></tr>
      <tr><td>Across file systems</td><td>No</td><td>Yes</td></tr><tr><td>Directories</td><td>Not allowed</td><td>Allowed</td></tr></table>
      <p><code>.</code> and <code>..</code> are themselves hard links to the directory and its parent.</p>`,
      cmds: [['ls -i', 'Show inode numbers'], ['stat file', 'Full metadata: inode, links, times'], ['ln a b', 'Hard link'], ['ln -s a b', 'Soft (symbolic) link'], ['readlink -f link', 'Resolve a link to its final target'], ['du -sh dir', 'Disk usage summary']],
      ex: [{ c: 'ln -sf notes.txt shortcut; ls -l shortcut', n: 'Note the -> arrow' }, { c: 'ln -sf notes.txt shortcut; head -n 1 shortcut', n: 'Reading through the link' }, { c: 'stat notes.txt', n: 'Metadata' }] },
    { id: 'sys', h: 'System information and /proc',
      html: `<p><code>/proc</code> and <code>/sys</code> are <b>in-memory file systems</b>: nothing is stored on disk; the kernel generates the content as you read it. That is why <code>cat /proc/cpuinfo</code> shows your CPUs and <code>cat /proc/meminfo</code> shows RAM. Each running process also gets a numbered directory <code>/proc/&lt;pid&gt;</code>.</p>`,
      cmds: [['cat /proc/cpuinfo', 'CPU details'], ['cat /proc/meminfo', 'Memory details'], ['cat /proc/version', 'Kernel version string'], ['free -h', 'Memory usage, human-readable'], ['df -h', 'Disk space per file system'], ['date', 'Current date/time'], ['date -R', 'RFC 5322 format'], ['cal', 'Calendar'], ['whoami', 'Current user']],
      ex: [{ c: 'cat /proc/version', n: 'Kernel build info' }, { c: 'free -h', n: 'Memory' }, { c: 'df -h', n: 'Disks' }, { c: 'date +%F', n: 'Custom date format' }] },
  ],
  quiz: [
    { q: 'Which of these is the actual Linux "kernel"-level responsibility?', o: ['Running ls', 'Managing hardware, memory and processes', 'Drawing windows', 'Interpreting your typed commands'], a: 1, e: 'The kernel handles hardware, memory and scheduling; the shell interprets commands.' },
    { q: 'What does chmod 640 file produce?', o: ['rwxr-----', 'rw-r-----', 'rw-r--r--', 'r--r-----'], a: 1, e: '6=rw-, 4=r--, 0=---.' },
    { q: 'You delete the original file. Which link still opens the data?', o: ['Soft link', 'Hard link', 'Both', 'Neither'], a: 1, e: 'A hard link is another name for the same inode, so data survives until the last name is removed.' },
    { q: 'Which command returns you to the previous directory?', o: ['cd ..', 'cd ~', 'cd -', 'cd /'], a: 2, e: 'cd - swaps with $OLDPWD.' },
    { q: '/proc/cpuinfo is stored…', o: ['On the SSD in /proc', 'In the kernel — generated on read', 'In /etc', 'In swap'], a: 1, e: '/proc is a virtual file system generated by the kernel.' },
    { q: 'To copy a directory you need…', o: ['cp -d', 'cp -r', 'cp -a only', 'mv'], a: 1, e: 'cp needs -r for directories (mv does not).' },
    { q: 'To delete a file you need write permission on…', o: ['The file', 'The directory containing it', 'Both always', 'The root directory'], a: 1, e: 'Deleting edits the directory entry.' },
  ],
});

ch({
  id: 'editors', n: 2, weeks: 'Week 2', title: 'Command Line Editors', icon: '✍️',
  intro: 'ed, vi/vim, nano and emacs — why they exist, how modal editing works, and the minimum you need to survive on any server.',
  sections: [
    { id: 'why', h: 'Why terminal editors?',
      html: `<p>On a remote server there is often no GUI — only a shell. A terminal editor is therefore a survival skill. The family tree: <b>ed</b> (1969, line editor) → <b>ex</b> → <b>vi</b> (visual mode of ex) → <b>Vim</b> ("Vi IMproved"). <b>Emacs</b> grew along a separate branch, and <b>nano</b> is the friendly, modeless "peacemaker".</p>
      <table class="t"><tr><th>Editor</th><th>Style</th><th>Quit</th></tr><tr><td>nano</td><td>Modeless; shortcuts listed on screen</td><td><kbd>Ctrl+X</kbd></td></tr><tr><td>vi/vim</td><td>Modal (Normal / Insert / Command-line)</td><td><code>:q</code>, <code>:wq</code>, <code>:q!</code></td></tr><tr><td>emacs</td><td>Modeless; chords and an extensible Lisp core</td><td><kbd>Ctrl+X Ctrl+C</kbd></td></tr><tr><td>ed</td><td>Line-oriented; no screen</td><td><code>q</code></td></tr></table>`,
      cmds: [['nano file', 'Open nano'], ['vi file', 'Open vi'], ['vim file', 'Open vim'], ['emacs -nw file', 'Emacs in the terminal']],
      ex: [] },
    { id: 'ed', h: 'ed: the line editor',
      html: `<p><code>ed</code> prints nothing unless you ask. Commands take an optional <b>address</b> (line number, range, <code>.</code> current, <code>$</code> last, <code>/re/</code> search) followed by a one-letter command.</p>
      <pre class="diagram">,p        print whole buffer          2,3p     print lines 2-3
$         go to last line             /hello/  search forward
a  …  .   append text (end with a lone .)
d         delete line                 s/a/b/   substitute
w         write file                  q        quit
r !date   insert output of a shell command
%s/\\(.*\\)/PREFIX \\1/   prefix every line</pre>`,
      cmds: [['ed file', 'Start ed'], [',p', 'Print the whole buffer'], ['2,3p', 'Print lines 2–3'], ['/text/', 'Search for text'], ['a', 'Append after current line (finish with .)'], ['d', 'Delete current line'], ['s/a/b/', 'Substitute first a with b on the current line'], ['5,6j', 'Join lines 5 and 6'], ['m1', 'Move current line after line 1'], ['u', 'Undo'], ['w', 'Write to file'], ['q', 'Quit']],
      ex: [{ c: "sed -n '2,3p' notes.txt", n: "sed's addressing was inherited from ed" }, { c: "sed 's/^/PREFIX /' fruits.txt | head -n 2", n: 'Same idea as %s/^/PREFIX /' }] },
    { id: 'vim', h: 'vi / Vim: modes and motions',
      html: `<p>Vim is <b>modal</b>: the same key does different things depending on the mode.</p>
      <ul><li><b>Normal</b> (default; <kbd>Esc</kbd> returns here): keys are commands.</li><li><b>Insert</b> (<kbd>i</kbd>, <kbd>a</kbd>, <kbd>o</kbd>, <kbd>A</kbd>): keys type text.</li><li><b>Command-line</b> (<kbd>:</kbd>): ex commands such as <code>:w</code>, <code>:q</code>, <code>:%s/old/new/g</code>.</li><li><b>Visual</b> (<kbd>v</kbd>): select text.</li></ul>
      <div class="vimgrid"><div><h4>Move</h4><code>h j k l</code> ← ↓ ↑ →<br><code>w b</code> word fwd/back<br><code>0 $</code> line start/end<br><code>gg G</code> file top/bottom<br><code>5G</code> or <code>:5</code> line 5<br><code>Ctrl-f / Ctrl-d / Ctrl-u</code> page / half down / half up</div>
      <div><h4>Edit</h4><code>x</code> delete char<br><code>dd</code> delete line<br><code>dw</code>, <code>2dw</code> delete word(s)<br><code>yy</code> copy line · <code>p</code> paste<br><code>cw</code> change word · <code>r</code> replace char<br><code>u</code> undo · <code>Ctrl-r</code> redo</div>
      <div><h4>Search / replace</h4><code>/word</code> then <code>n</code>/<code>N</code><br><code>:s/a/b/</code> current line<br><code>:1,5s/line/LINE/g</code> range<br><code>:%s/hello/hola/g</code> whole file<br><code>:set nu</code> / <code>:set nonu</code> line numbers</div>
      <div><h4>Save & quit</h4><code>:w</code> save · <code>:q</code> quit<br><code>:wq</code> or <code>ZZ</code> both<br><code>:q!</code> quit, discard</div></div>
      <p><b>Counts</b> multiply any command: <code>3dd</code> deletes three lines, <code>10x</code> ten chars. DOS line endings show as <code>^M</code>; remove with <code>:%s/\\r//g</code>.</p>`,
      cmds: [['i / a / o', 'Insert before / after cursor / on new line'], ['Esc', 'Back to Normal mode'], ['dd', 'Delete (cut) line'], ['yy then p', 'Copy line, paste below'], ['x', 'Delete character'], ['dw / 2dw', 'Delete word(s)'], ['cw', 'Change word'], ['u', 'Undo'], [':wq', 'Write and quit'], [':q!', 'Quit without saving'], [':%s/old/new/g', 'Replace everywhere'], [':set nu', 'Show line numbers'], ['/pattern', 'Search forward']],
      ex: [] },
    { id: 'nano', h: 'nano and Emacs in a nutshell',
      html: `<p><b>nano</b> shows its shortcuts at the bottom (<code>^</code> = Ctrl): <kbd>^O</kbd> write out, <kbd>^X</kbd> exit, <kbd>^W</kbd> search, <kbd>^K</kbd> cut line, <kbd>^U</kbd> paste, <kbd>^G</kbd> help. It is the right tool for editing a script quickly.</p>
      <p><b>Emacs</b> is more an environment than an editor. Key chords: <kbd>C-x C-f</kbd> open, <kbd>C-x C-s</kbd> save, <kbd>C-x C-c</kbd> quit, <kbd>C-g</kbd> cancel, <kbd>C-s</kbd> search, <kbd>M-x</kbd> run any command by name (M = Alt/Meta).</p>
      <div class="callout tip">Pick <b>one</b> editor and learn it well. If you are unsure, learn nano today and vim basics this week.</div>`,
      cmds: [['Ctrl+O, Ctrl+X', 'nano: save, exit'], ['Ctrl+W', 'nano: search'], ['Ctrl+K / Ctrl+U', 'nano: cut / paste line'], ['C-x C-s', 'emacs: save'], ['C-x C-c', 'emacs: quit'], ['scp file user@host:path', 'Copy a file between machines'], ['tar -xvf a.tar', 'Extract an archive']],
      ex: [] },
  ],
  quiz: [
    { q: 'In Vim you typed text but nothing appears — you are probably in…', o: ['Insert mode', 'Normal mode', 'Visual mode', 'Replace mode'], a: 1, e: 'Normal mode treats keys as commands; press i to insert.' },
    { q: 'Which sequence saves and exits vim?', o: [':q!', ':w', ':wq', ':x!'], a: 2, e: ':wq writes then quits (:q! discards).' },
    { q: 'Replace every "cat" with "dog" in the entire file in Vim:', o: [':s/cat/dog/', ':%s/cat/dog/g', ':1,5s/cat/dog/', '/cat/dog'], a: 1, e: '% = all lines, g = all occurrences per line.' },
    { q: 'Which editor was the original line editor ancestor of vi?', o: ['nano', 'emacs', 'ed', 'pico'], a: 2, e: 'ed → ex → vi → vim.' },
    { q: 'In ed, which command inserts the output of `date`?', o: ['r !date', '!date', 'a date', 'w date'], a: 0, e: 'r !cmd reads command output into the buffer.' },
  ],
});

ch({
  id: 'network', n: 3, weeks: 'Week 2', title: 'Networking and SSH', icon: '🌐',
  intro: 'IP addresses, subnets, ports, firewalls, and how to log in to a remote machine securely with SSH keys.',
  sections: [
    { id: 'ip', h: 'Networks, IP addresses and subnets',
      html: `<p>A <b>network</b> connects devices so they can exchange packets. A <b>LAN</b> is local (home, campus); a <b>WAN</b> spans cities; the Internet is a network of networks. Devices: hosts, switches (connect devices inside a LAN), routers (connect networks) and firewalls (filter traffic).</p>
      <p>An <b>IPv4 address</b> is 32 bits written as four decimals, e.g. <code>192.168.1.10</code>. The <b>subnet mask</b> (or <b>CIDR</b> prefix) splits it into <em>network</em> and <em>host</em> parts: <code>192.168.1.0/24</code> means the first 24 bits are the network, leaving 8 host bits → 2⁸ = 256 addresses (254 usable).</p>
      <table class="t"><tr><th>Private ranges (not routed on the Internet)</th></tr><tr><td><code>10.0.0.0/8</code></td></tr><tr><td><code>172.16.0.0/12</code></td></tr><tr><td><code>192.168.0.0/16</code></td></tr></table>
      <p>A machine can have <b>several IPs</b> — one per interface, plus virtual ones for containers and VMs — and <code>127.0.0.1</code> (<code>localhost</code>) always refers to itself. DNS maps names to IPs; <code>dig</code> queries it.</p>
      <div class="cidr"><label>Try CIDR: <input id="cidrIn" value="192.168.1.0/24" spellcheck="false"></label><output id="cidrOut"></output></div>`,
      cmds: [['ip addr', 'Show interfaces and IPs (replaces ifconfig)'], ['hostname -I', 'IPs of this host'], ['ping host', 'Test reachability'], ['dig domain', 'DNS lookup'], ['dig -x IP', 'Reverse lookup (IP → name)'], ['dig +noall +answer domain', 'One-line DNS answer'], ['ss -tuln', 'Listening TCP/UDP sockets'], ['curl url', 'Fetch a URL'], ['traceroute host', 'Path packets take']],
      ex: [{ c: 'hostname', n: 'This simulated machine' }] },
    { id: 'ports', h: 'Ports, protocols, firewalls and SELinux',
      html: `<p>An IP finds the <em>machine</em>; a <b>port</b> (0–65535) finds the <em>service</em> on it. Well-known ports:</p>
      <table class="t"><tr><th>Port</th><th>Service</th><th>Port</th><th>Service</th></tr><tr><td>22</td><td>SSH</td><td>80</td><td>HTTP</td></tr><tr><td>443</td><td>HTTPS</td><td>53</td><td>DNS</td></tr><tr><td>21</td><td>FTP</td><td>25</td><td>SMTP</td></tr></table>
      <p><b>TCP</b> gives reliable, ordered streams (web, SSH); <b>UDP</b> is fast and connectionless (DNS, streaming). A <b>firewall</b> allows or blocks traffic by address, port and protocol (e.g. <code>ufw</code>, <code>iptables</code>/<code>nftables</code>). <b>SELinux</b> adds <em>mandatory access control</em>: even if file permissions allow it, a process may be denied by policy. Check with <code>getenforce</code> or <code>sestatus</code>; <code>ls -Z</code> shows security contexts.</p>`,
      cmds: [['ss -tuln', 'Which ports are listening'], ['getenforce', 'SELinux mode: Enforcing / Permissive / Disabled'], ['sudo ufw status', 'Firewall status'], ['nmap host', 'Scan ports (install nmap first)'], ['cat /etc/services', 'Port ↔ service name table']],
      ex: [] },
    { id: 'ssh', h: 'SSH: secure remote login',
      html: `<p><b>SSH</b> (Secure Shell) replaced telnet/rsh by encrypting everything. Connect with <code>ssh user@host</code> (default port 22; <code>-p</code> to change). The server runs the <b>sshd daemon</b>.</p>
      <h4>Key-based authentication</h4>
      <ol><li><code>ssh-keygen -t ed25519</code> creates a <b>private</b> key (<code>~/.ssh/id_ed25519</code> — never share) and a <b>public</b> key (<code>.pub</code>).</li><li><code>ssh-copy-id user@host</code> appends the public key to the server's <code>~/.ssh/authorized_keys</code>.</li><li>Login now proves you hold the private key — no password sent.</li></ol>
      <p>Copy files with <code>scp file user@host:/path</code>. Use <code>~/.ssh/config</code> to define short aliases (<code>Host lab</code> → <code>HostName</code>, <code>User</code>, <code>Port</code>). First connection shows the host's fingerprint, stored in <code>~/.ssh/known_hosts</code>.</p>
      <div class="callout warn">Permissions matter: <code>chmod 700 ~/.ssh</code> and <code>chmod 600 ~/.ssh/id_*</code> or SSH will refuse to use the key.</div>`,
      cmds: [['ssh user@host', 'Log in remotely'], ['ssh -p 2222 user@host', 'Non-default port'], ['ssh-keygen -t ed25519', 'Generate a key pair'], ['ssh-copy-id user@host', 'Install your public key on the server'], ['scp f user@host:~/', 'Upload a file'], ['scp user@host:~/f .', 'Download a file'], ['systemctl status ssh', 'Is the daemon running?']],
      ex: [] },
  ],
  quiz: [
    { q: 'How many usable host addresses are in 192.168.1.0/24?', o: ['256', '254', '255', '24'], a: 1, e: '256 total minus network and broadcast addresses.' },
    { q: 'Which is NOT a private IPv4 range?', o: ['10.1.2.3', '172.20.5.1', '192.168.0.9', '8.8.8.8'], a: 3, e: '8.8.8.8 is a public DNS server.' },
    { q: 'Which file lists the public keys allowed to log in?', o: ['known_hosts', 'id_rsa', 'authorized_keys', 'config'], a: 2, e: 'authorized_keys lives on the server in ~/.ssh.' },
    { q: 'Default SSH port?', o: ['21', '22', '80', '443'], a: 1, e: 'SSH = 22.' },
    { q: 'SELinux is best described as…', o: ['A firewall', 'Mandatory access control for processes and files', 'A package manager', 'A shell'], a: 1, e: 'It enforces policy beyond normal rwx permissions.' },
  ],
});

ch({
  id: 'process', n: 4, weeks: 'Week 3', title: 'Process Management', icon: '⚙️',
  intro: 'What a process is, foreground vs background, job control, signals, and exit codes.',
  sections: [
    { id: 'proc', h: 'Processes, PIDs and the process tree',
      html: `<p>A <b>process</b> is a running program with its own <b>PID</b>. Every process (except <code>init</code>/<code>systemd</code>, PID 1) has a <b>parent</b> (PPID); starting a command forks a child of your shell. <code>$$</code> is the PID of the current shell, and <code>$!</code> the PID of the last background job.</p>
      <p>Because a script or <code>( … )</code> runs in a <em>child</em> shell, variables it sets disappear when it exits — unless you <code>source</code> it.</p>`,
      cmds: [['ps', 'Processes of this terminal'], ['ps -ef', 'All processes, full format'], ['ps --forest', 'ASCII process tree'], ['pstree', 'Tree view'], ['top', 'Live view (q quits)'], ['echo $$', 'PID of current shell'], ['pgrep name', 'PIDs matching a name'], ['pkill name', 'Kill by name']],
      ex: [{ c: 'echo $$', n: 'Shell PID' }, { c: 'ps', n: 'What is running here' }] },
    { id: 'jobs', h: 'Foreground, background and job control',
      html: `<pre class="diagram">cmd &amp;      start in background         jobs      list jobs
Ctrl+Z     suspend foreground job      bg %1     resume in background
fg %1      bring to foreground         Ctrl+C    interrupt (SIGINT)
nohup cmd &amp;  survive logout            disown    detach job from shell</pre>
      <p><code>sleep 100 &amp;</code> prints <code>[1] 4321</code> (job number and PID). <code>coproc</code> starts a background process connected by pipes. <code>at</code> runs a command once later and <code>cron</code> runs it on a schedule.</p>`,
      cmds: [['sleep 60 &', 'Run in background'], ['jobs', 'List shell jobs'], ['fg %1', 'Foreground job 1'], ['bg %1', 'Continue job 1 in background'], ['Ctrl+Z', 'Suspend current job'], ['Ctrl+C', 'Interrupt current job'], ['nohup cmd &', 'Keep running after logout'], ['disown %1', 'Remove from shell job table']],
      ex: [] },
    { id: 'kill', h: 'Signals and kill',
      html: `<p><code>kill</code> doesn't only kill — it <em>sends a signal</em>. Common ones:</p>
      <table class="t"><tr><th>Signal</th><th>#</th><th>Meaning</th></tr><tr><td>SIGHUP</td><td>1</td><td>Terminal closed / reload config</td></tr><tr><td>SIGINT</td><td>2</td><td>Ctrl+C</td></tr><tr><td>SIGKILL</td><td>9</td><td>Force kill — cannot be caught</td></tr><tr><td>SIGTERM</td><td>15</td><td>Polite request to exit (default)</td></tr><tr><td>SIGSTOP / SIGCONT</td><td>19 / 18</td><td>Pause / resume</td></tr></table>
      <p>Try SIGTERM (<code>kill PID</code>) first; use <code>kill -9 PID</code> as a last resort because the process can't clean up.</p>`,
      cmds: [['kill PID', 'Send SIGTERM'], ['kill -9 PID', 'Send SIGKILL'], ['kill -l', 'List signal names'], ['killall name', 'Kill all with this name'], ['pkill -f pattern', 'Kill by full command line']],
      ex: [] },
    { id: 'hist', h: 'History, brace expansion and chaining',
      html: `<p><code>history</code> lists previous commands; <code>!n</code> reruns number n, <code>!!</code> repeats the last, <code>!$</code> reuses its last argument, and <kbd>Ctrl+R</kbd> searches backwards. <b>Brace expansion</b> generates strings: <code>echo {1..5}</code>, <code>mkdir proj/{src,docs,tests}</code>, <code>cp file.txt{,.bak}</code>.</p>
      <p>Multiple commands: <code>a ; b</code> (always run both), <code>a &amp;&amp; b</code> (b only if a succeeded), <code>a || b</code> (b only if a failed). Wrap in <code>( )</code> to run in a subshell.</p>`,
      cmds: [['history', 'Show history'], ['!!', 'Repeat last command'], ['!n', 'Repeat command number n'], ['echo {1..5}', 'Range expansion'], ['echo {a,b,c}', 'List expansion'], ['cmd1 ; cmd2', 'Run sequentially'], ['cmd1 && cmd2', 'Run cmd2 if cmd1 succeeds'], ['cmd1 || cmd2', 'Run cmd2 if cmd1 fails'], ['( cmd )', 'Run in a subshell']],
      ex: [{ c: 'echo {1..5}', n: 'Counting' }, { c: 'echo file{1,2,3}.txt', n: 'List' }, { c: 'echo {a..e}{1,2}', n: 'Combine' }, { c: 'true && echo yes || echo no', n: 'Chain' }, { c: 'false && echo yes || echo no', n: 'Chain, failing' }] },
    { id: 'exit', h: 'Exit codes',
      html: `<p>Every command ends with an <b>exit status</b> from 0–255. <b>0 = success</b>; anything else is an error whose meaning is chosen by the program (<code>grep</code>: 0 matched, 1 no match, 2 error; 127: command not found; 126: not executable; 130: killed by Ctrl+C). Read the last status with <code>$?</code>. <code>&amp;&amp;</code>, <code>||</code>, <code>if</code> and <code>while</code> all branch on it.</p>`,
      cmds: [['echo $?', 'Exit status of last command'], ['true; false', 'Always 0 / always 1'], ['exit 3', 'Exit shell with status 3'], ['bc', 'Calculator (Ctrl+D to quit)']],
      ex: [{ c: 'ls notes.txt; echo $?', n: 'Success → 0' }, { c: 'ls nothing 2>/dev/null; echo $?', n: 'Error → non-zero' }, { c: 'grep zzz notes.txt; echo $?', n: 'grep: no match → 1' }, { c: 'nosuchcmd; echo $?', n: 'Not found → 127' }] },
  ],
  quiz: [
    { q: 'Which signal cannot be caught or ignored?', o: ['SIGTERM', 'SIGINT', 'SIGKILL', 'SIGHUP'], a: 2, e: 'SIGKILL (9) goes straight to the kernel.' },
    { q: 'cmd1 && cmd2 runs cmd2 when…', o: ['cmd1 fails', 'cmd1 succeeds', 'always', 'cmd1 is backgrounded'], a: 1, e: '&& = AND-then.' },
    { q: 'What does $? hold?', o: ['PID of shell', 'Exit status of the last command', 'Number of args', 'Last argument'], a: 1, e: '0 means success.' },
    { q: 'Ctrl+Z does what to a foreground job?', o: ['Kills it', 'Suspends it', 'Detaches it', 'Nothing'], a: 1, e: 'It sends SIGTSTP; resume with fg/bg.' },
    { q: 'Result of echo {1..3}{a,b} ?', o: ['1 2 3 a b', '1a 1b 2a 2b 3a 3b', '1a2b3', '{1..3}{a,b}'], a: 1, e: 'Brace expansions combine as a product.' },
  ],
});

ch({
  id: 'software', n: 5, weeks: 'Week 3', title: 'Software Management (apt & dpkg)', icon: '📦',
  intro: 'Finding, installing and inspecting packages on Debian/Ubuntu systems.',
  sections: [
    { id: 'os', h: 'Know your system',
      html: `<p>Before installing anything know what you are on: <code>cat /etc/os-release</code> (distribution), <code>uname -r</code> (kernel), <code>uname -m</code> (architecture, e.g. x86_64, aarch64). Debian-family distributions (Ubuntu, Mint) use <b>.deb</b> packages managed by <b>dpkg</b> (low level) and <b>apt</b> (high level, resolves dependencies and downloads).</p>`,
      cmds: [['cat /etc/os-release', 'Distribution details'], ['uname -r', 'Kernel release'], ['uname -m', 'Machine architecture'], ['sudo', 'Run a command as root (policy in /etc/sudoers)']],
      ex: [{ c: 'cat /etc/os-release', n: 'Simulated Ubuntu' }, { c: 'uname -m', n: 'Architecture' }] },
    { id: 'apt', h: 'apt: the daily driver',
      html: `<p>apt reads its repository list from <code>/etc/apt/sources.list</code> and <code>/etc/apt/sources.list.d/</code>. The usual rhythm:</p>
      <pre class="diagram">sudo apt update            # refresh the package index (does NOT upgrade anything)
sudo apt upgrade           # install newer versions of installed packages
sudo apt install nmap      # install (and dependencies)
sudo apt reinstall nmap    # repair a broken install
sudo apt remove nmap       # remove, keep config   |  purge: remove config too
sudo apt autoremove        # drop no-longer-needed dependencies</pre>
      <p>Searching: <code>apt-cache search word</code>, <code>apt-cache show pkg</code> (details), <code>apt-cache pkgnames nm</code> (names starting with "nm"). Logs live in <code>/var/log/apt</code> and <code>/var/log/dpkg.log</code>.</p>`,
      cmds: [['sudo apt update', 'Refresh index'], ['sudo apt upgrade', 'Upgrade installed packages'], ['sudo apt install pkg', 'Install'], ['sudo apt remove pkg', 'Remove'], ['sudo apt autoremove', 'Clean up unused deps'], ['apt-cache search word', 'Search packages'], ['apt-cache show pkg', 'Package details'], ['apt-cache pkgnames nm', 'List names beginning with nm']],
      ex: [] },
    { id: 'dpkg', h: 'dpkg: inspecting the package database',
      html: `<p>dpkg works on individual <code>.deb</code> files and the local database in <code>/var/lib/dpkg</code>.</p>
      <ul><li><code>dpkg -l pattern</code> – list installed packages matching a pattern</li><li><code>dpkg -L pkg</code> – files installed by a package</li><li><code>dpkg -S /path/file</code> – which package owns a file</li><li><code>dpkg -s pkg</code> – status/details</li><li><code>sudo dpkg -i file.deb</code> – install a local .deb</li></ul>
      <p>Custom report: <code>dpkg-query -W -f='\${Section} \${binary:Package}\\n' | sort | less</code>. Verify downloads with <code>sha256sum file</code> and compare against the published checksum.</p>`,
      cmds: [['dpkg -l pattern', 'List matching installed packages'], ['dpkg -L pkg', 'Files of a package'], ['dpkg -S file', 'Package owning a file'], ['dpkg -s pkg', 'Package status'], ['sudo dpkg -i x.deb', 'Install local .deb'], ['sha256sum file', 'Compute checksum']],
      ex: [] },
  ],
  quiz: [
    { q: 'apt update does…', o: ['Upgrades all packages', 'Refreshes the package index', 'Removes old kernels', 'Installs updates and reboots'], a: 1, e: 'It only syncs metadata; apt upgrade installs new versions.' },
    { q: 'Which finds which package provided /bin/ls?', o: ['dpkg -L ls', 'dpkg -S /bin/ls', 'apt show /bin/ls', 'apt-cache pkgnames ls'], a: 1, e: '-S searches for the owning package.' },
    { q: 'Where are repository sources defined?', o: ['/etc/apt/sources.list', '/var/lib/dpkg', '/proc/apt', '/usr/share/apt'], a: 0, e: 'Plus /etc/apt/sources.list.d/.' },
    { q: 'Installing a downloaded .deb manually uses…', o: ['apt-get build', 'dpkg -i', 'make', 'tar -x'], a: 1, e: 'dpkg -i file.deb (apt install ./file.deb also resolves deps).' },
  ],
});

ch2({
  id: 'streams', n: 6, weeks: 'Week 3', title: 'Streams, Redirection and Pipes', icon: '🔀',
  intro: 'Every program has three streams. Learn to redirect them to files and connect programs into pipelines.',
  sections: [
    { id: 'fd', h: 'The three standard streams',
      html: `<p>Each process starts with three open <b>file descriptors</b>:</p>
      <table class="t"><tr><th>FD</th><th>Name</th><th>Default</th></tr><tr><td>0</td><td>stdin</td><td>keyboard</td></tr><tr><td>1</td><td>stdout</td><td>terminal</td></tr><tr><td>2</td><td>stderr</td><td>terminal</td></tr></table>
      <p>Normal results go to stdout, errors/diagnostics to stderr — separate streams, so you can keep one and discard the other.</p>`,
      cmds: [['cmd > file', 'stdout → file (overwrite)'], ['cmd >> file', 'stdout → file (append)'], ['cmd 2> file', 'stderr → file'], ['cmd > out 2> err', 'Split both streams'], ['cmd > file 2>&1', 'stdout and stderr to the same file'], ['cmd < file', 'stdin from a file'], ['cmd 2> /dev/null', 'Discard errors'], ['cat > file', 'Type text; Ctrl+D ends']],
      ex: [{ c: 'echo hello > out.txt; cat out.txt', n: 'Overwrite' }, { c: 'echo world >> out.txt; cat out.txt', n: 'Append' }, { c: 'ls nothing 2> err.txt; cat err.txt', n: 'Capture only errors' }, { c: 'ls notes.txt nothing > out.txt 2> err.txt; cat out.txt err.txt', n: 'Split streams' }, { c: 'ls notes.txt nothing > both.txt 2>&1; cat both.txt', n: 'Merge streams' }, { c: 'wc -l < fruits.txt', n: 'stdin redirect — no filename in the output' }] },
    { id: 'pipe', h: 'Pipes and the UNIX philosophy',
      html: `<p>The pipe <code>|</code> connects the stdout of one command to the stdin of the next, so small single-purpose tools compose into pipelines. Data flows left to right, all stages running concurrently.</p>
      <pre class="diagram">cat access.log | cut -d' ' -f1 | sort | uniq -c | sort -rn | head
   source        extract       group   count     rank        top 10</pre>
      <p>Only stdout is piped. To pipe both, redirect first: <code>cmd 2&gt;&amp;1 | less</code> (or <code>|&amp;</code> in bash). <code>tee file</code> copies the stream to a file <em>and</em> passes it on — a T-junction: <code>cmd | tee out.txt | wc -l</code>. <code>tee -a</code> appends.</p>
      <p><code>/dev/null</code> is the black hole; <code>/dev/zero</code> and <code>/dev/urandom</code> produce bytes. <b>Named pipes</b> (<code>mkfifo p</code>) are pipes with a name on disk; <b>process substitution</b> <code>&lt;(cmd)</code> lets you use command output as if it were a file: <code>diff &lt;(sort a) &lt;(sort b)</code>.</p>`,
      cmds: [['a | b', 'Pipe stdout of a into b'], ['a 2>&1 | b', 'Pipe both streams'], ['cmd | tee file', 'Save and pass through'], ['cmd | tee -a file', 'Append and pass through'], ['sort | uniq -c', 'Count duplicates'], ['<(cmd)', 'Process substitution'], ['mkfifo name', 'Create a named pipe'], ['diff a b', 'Compare files']],
      ex: [{ c: "cut -d' ' -f1 access.log | sort | uniq -c | sort -rn", n: 'Top client IPs' }, { c: 'cat fruits.txt | sort | uniq -c | sort -rn | head -n 3', n: 'Most frequent fruit' }, { c: 'cat notes.txt | tee copy.txt | wc -l; ls', n: 'tee in the middle' }, { c: "awk '{print $9}' access.log | sort | uniq -c", n: 'Count HTTP statuses (field 9 of the quoted log)' }] },
    { id: 'subst', h: 'Heredocs, here-strings and substitution',
      html: `<p>A <b>here document</b> feeds multi-line text to stdin: <code>cat &lt;&lt;EOF … EOF</code> (use <code>&lt;&lt;-</code> to strip leading tabs; quote the marker, <code>&lt;&lt;'EOF'</code>, to stop variable expansion). A <b>here string</b> <code>&lt;&lt;&lt; "text"</code> supplies a single string.</p>
      <p><b>Command substitution</b> <code>$(cmd)</code> replaces itself with the command's output; <b>arithmetic expansion</b> <code>$((3 + 4))</code> computes integers.</p>`,
      cmds: [['cat <<EOF', 'Start a heredoc, end with EOF'], ['cmd <<< "text"', 'Here string'], ['$(cmd)', 'Command substitution'], ['$((a+b))', 'Integer arithmetic'], ['echo "Today is $(date +%A)"', 'Embed output in text']],
      ex: [{ c: 'echo "files: $(ls | wc -l)"', n: 'Substitution' }, { c: 'echo $((6*7))', n: 'Arithmetic' }, { c: 'N=$(wc -l < fruits.txt); echo "fruits: $N"', n: 'Capture into a variable' }] },
  ],
  quiz: [
    { q: 'Which redirects both stdout and stderr to all.txt?', o: ['cmd > all.txt', 'cmd 2> all.txt', 'cmd > all.txt 2>&1', 'cmd 2>&1 > all.txt'], a: 2, e: 'Order matters: send stdout to the file first, then duplicate stderr to it.' },
    { q: '> vs >>', o: ['No difference', '> appends, >> overwrites', '> overwrites, >> appends', '>> redirects stderr'], a: 2, e: '> truncates; >> appends.' },
    { q: 'What does tee do?', o: ['Splits the stream to a file and stdout', 'Sorts', 'Deletes duplicates', 'Compresses'], a: 0, e: 'Like a T-pipe fitting.' },
    { q: 'A pipe passes…', o: ['stdin', 'stdout', 'stderr', 'exit codes'], a: 1, e: 'Only stdout, unless you merge stderr first.' },
    { q: 'sort | uniq -c is needed because uniq only collapses…', o: ['Sorted files', 'Adjacent duplicates', 'Numbers', 'Words'], a: 1, e: 'uniq compares neighbouring lines.' },
  ],
});

ch2({
  id: 'pattern', n: 7, weeks: 'Week 4', title: 'Pattern Matching & Text Tools', icon: '🔍',
  intro: 'Globs, regular expressions (BRE, ERE, PCRE) and the small text-slicing tools: cut, tr, sort, uniq, paste, fold.',
  sections: [
    { id: 'glob', h: 'Globs vs regular expressions',
      html: `<p><b>Globs</b> are expanded by the <em>shell</em> against file names: <code>*</code> any string, <code>?</code> one char, <code>[abc]</code>/<code>[a-z]</code> one of, <code>[!x]</code> not. <b>Regexes</b> are interpreted by <em>programs</em> (grep, sed, awk) against text. The same characters mean different things — quote regexes so the shell leaves them alone.</p>`,
      cmds: [['ls *.txt', 'Glob: all .txt files'], ['ls ?ruits.txt', '? = exactly one char'], ['ls [a-f]*', 'Names starting a–f'], ["grep 'a.*b' file", 'Regex (quoted)']],
      ex: [{ c: 'ls *.txt', n: 'Glob expansion' }, { c: 'ls [a-f]*', n: 'Range' }, { c: 'echo *.csv', n: 'echo shows what the shell expanded' }] },
    { id: 'bre', h: 'Regex building blocks',
      html: `<table class="t"><tr><th>Token</th><th>Meaning</th></tr>
      <tr><td><code>.</code></td><td>any one character</td></tr><tr><td><code>^</code> / <code>$</code></td><td>start / end of line</td></tr><tr><td><code>[abc]</code> <code>[^abc]</code> <code>[a-z]</code></td><td>set / negated set / range</td></tr>
      <tr><td><code>*</code></td><td>zero or more of the previous</td></tr><tr><td><code>\\{n,m\\}</code> (BRE) · <code>{n,m}</code> (ERE)</td><td>between n and m repeats</td></tr><tr><td><code>+</code> <code>?</code> (ERE)</td><td>one or more · zero or one</td></tr>
      <tr><td><code>a|b</code> (ERE)</td><td>alternation</td></tr><tr><td><code>( )</code> (ERE) · <code>\\( \\)</code> (BRE)</td><td>group & capture</td></tr><tr><td><code>\\1</code></td><td>back-reference to group 1</td></tr><tr><td><code>\\b</code> <code>\\&lt;</code> <code>\\&gt;</code></td><td>word boundary</td></tr></table>
      <p><b>POSIX classes</b> live inside brackets: <code>[[:alpha:]]</code>, <code>[[:digit:]]</code>, <code>[[:alnum:]]</code>, <code>[[:upper:]]</code>, <code>[[:lower:]]</code>, <code>[[:space:]]</code>, <code>[[:punct:]]</code>, <code>[[:blank:]]</code>.</p>
      <p><b>BRE vs ERE:</b> in basic regex (<code>grep</code>, <code>sed</code>) the characters <code>+ ? | ( ) { }</code> are literal unless backslashed; in extended regex (<code>grep -E</code>/<code>egrep</code>, <code>sed -E</code>, <code>awk</code>) it is the other way round. <b>PCRE</b> (<code>grep -P</code>) adds lazy quantifiers (<code>.*?</code>), look-ahead/behind, named groups and <code>\\d</code>.</p>
      <p><b>Precedence</b> (high→low): grouping, quantifiers, concatenation, alternation. So <code>ab|cd</code> means (ab)|(cd), and <code>(ma)+</code> repeats the group while <code>ma+</code> repeats only the <em>a</em>. Also note greediness: <code>M*a</code> vs <code>M.*a</code> differ.</p>
      <p class="cta">👉 Experiment live in the <a href="#" data-go="playground:regex">Regex Playground</a>.</p>`,
      cmds: [["grep 'pat' file", 'BRE search'], ["grep -E 'a|b' file", 'ERE alternation'], ["grep '^pat' file", 'Lines starting with pat'], ["grep 'pat$' file", 'Lines ending with pat'], ["grep '[[:digit:]]\\{3\\}' f", 'Three digits (BRE)'], ["egrep '[[:digit:]]{6}' f", 'Six digits (ERE)'], ["grep '\\(ab\\)\\1' f", 'Back-reference'], ["grep -P '\\d+' f", 'PCRE digits']],
      ex: [{ c: "grep '^a' fruits.txt", n: 'Anchored start' }, { c: "grep 'a$' fruits.txt", n: 'Anchored end' }, { c: "grep -E '^(a|b)' fruits.txt", n: 'ERE alternation' }, { c: "egrep '^[0-9]{2}f[0-9]{7}' rollnos.txt", n: 'Valid roll numbers' }, { c: "grep -E '^[[:alnum:]._-]+@[[:alnum:].-]+\\.[a-z]{2,}$' emails.txt", n: 'Plausible e-mail addresses' }, { c: "grep -v '[[:alpha:]]@' emails.txt", n: 'Lines NOT matching' }] },
    { id: 'cut', h: 'cut, tr, sort, uniq, paste, fold, rev',
      html: `<p><b>cut</b> selects columns: <code>-c 1-4</code> characters, <code>-d, -f2</code> delimited fields (<code>-f1,3</code>, <code>-f2-</code>). Chain cuts to dig into nested formats: <code>cut -d/ -f3 | cut -d' ' -f1</code>. <b>tr</b> translates or deletes single characters from stdin only: <code>tr a-z A-Z</code>, <code>tr -d '\\r'</code>, <code>tr -s ' '</code> (squeeze repeats). <b>sort</b> (<code>-n</code> numeric, <code>-r</code> reverse, <code>-k2</code> by field, <code>-t,</code> delimiter, <code>-u</code> unique) and <b>uniq</b> (<code>-c</code> count, <code>-d</code> only duplicates) are the counting duo. <b>paste</b> merges files side by side, <b>fold -w 40</b> wraps lines, <b>rev</b> reverses each line, <b>nl</b> numbers lines.</p>`,
      cmds: [['cut -c1-4 f', 'First 4 characters'], ['cut -d, -f1,3 f', 'Fields 1 and 3 of CSV'], ['tr a-z A-Z', 'Upper-case'], ['tr -d "\\r"', 'Delete carriage returns'], ['tr -s " "', 'Squeeze spaces'], ['sort -n', 'Numeric sort'], ['sort -t, -k3 -n f', 'Sort CSV by column 3'], ['sort -u', 'Unique sorted'], ['uniq -c', 'Count adjacent duplicates'], ['paste a b', 'Join files by columns'], ['fold -w 30', 'Wrap at 30 columns'], ['rev', 'Reverse each line']],
      ex: [{ c: 'cut -d, -f1,3 scores.csv', n: 'Name and marks' }, { c: "sort -t, -k3 -n scores.csv | tail -n 3", n: 'Top 3 marks' }, { c: 'cut -d, -f2 scores.csv | tail -n +2 | sort | uniq -c', n: 'Students per subject' }, { c: 'cat notes.txt | tr a-z A-Z | head -n 2', n: 'Upper-case' }, { c: 'head -n 3 fruits.txt | rev', n: 'rev' }] },
  ],
  quiz: [
    { q: "In BRE (plain grep), which matches 'ab' two or more times?", o: ["'(ab){2,}'", "'\\(ab\\)\\{2,\\}'", "'ab+2'", "'[ab]{2}'"], a: 1, e: 'In basic regex groups and intervals need backslashes.' },
    { q: 'Which POSIX class matches letters and digits?', o: ['[[:alpha:]]', '[[:word:]]', '[[:alnum:]]', '[[:graph:]]'], a: 2, e: 'alnum = alpha + digit.' },
    { q: "cut -d, -f2 on 'a,b,c' prints:", o: ['a', 'b', 'c', 'a,b'], a: 1, e: 'Field 2 using comma as delimiter.' },
    { q: 'Who expands *.txt?', o: ['grep', 'The shell', 'ls', 'The kernel'], a: 1, e: 'Globbing happens before the command starts.' },
    { q: "egrep '(ma)+' matches…", o: ["'m' only", "'mama'", "'a+'", "'(ma)+' literally"], a: 1, e: 'The group repeats.' },
  ],
});

ch2({
  id: 'grep', n: 8, weeks: 'Week 4', title: 'grep in Depth', icon: '🔎',
  intro: 'Everything you can do with grep: invert, count, context, recursion, multiple patterns and only-matching output.',
  sections: [
    { id: 'opts', h: 'The options that matter',
      html: `<table class="t"><tr><th>Option</th><th>Effect</th></tr>
      <tr><td><code>-i</code></td><td>ignore case</td></tr><tr><td><code>-v</code></td><td>invert: lines that do <em>not</em> match</td></tr><tr><td><code>-n</code></td><td>prefix line numbers</td></tr><tr><td><code>-c</code></td><td>count matching lines</td></tr><tr><td><code>-o</code></td><td>print only the matching part</td></tr><tr><td><code>-w</code> / <code>-x</code></td><td>whole word / whole line</td></tr><tr><td><code>-l</code> / <code>-L</code></td><td>only names of files with / without matches</td></tr><tr><td><code>-H</code> / <code>-h</code></td><td>force / suppress filename prefix</td></tr><tr><td><code>-r</code></td><td>recurse into directories</td></tr><tr><td><code>-A n</code> <code>-B n</code> <code>-C n</code></td><td>lines of context after / before / around</td></tr><tr><td><code>-m n</code></td><td>stop after n matches</td></tr><tr><td><code>-q</code></td><td>quiet: only set the exit status (great in <code>if</code>)</td></tr><tr><td><code>-e p1 -e p2</code></td><td>several patterns (OR); <code>-f file</code> reads patterns from a file</td></tr><tr><td><code>-E</code> <code>-F</code> <code>-P</code></td><td>extended / fixed-string / Perl regex</td></tr></table>
      <p><b>AND</b> two patterns by piping: <code>grep a file | grep b</code>. Lines common to two files: <code>grep -Fxf a b</code>.</p>`,
      cmds: [['grep -i pat f', 'Ignore case'], ['grep -v pat f', 'Invert'], ['grep -n pat f', 'Line numbers'], ['grep -c pat f', 'Count'], ['grep -o pat f', 'Only the match'], ['grep -w pat f', 'Whole word'], ['grep -rn pat dir', 'Recursive with numbers'], ['grep -C 2 pat f', '2 lines of context'], ['grep -e a -e b f', 'a OR b'], ['grep -Fxf a b', 'Lines common to both files'], ['grep -q pat f', 'Silent; use $?']],
      ex: [{ c: 'grep -n apple fruits.txt', n: 'Numbered' }, { c: 'grep -c apple fruits.txt', n: 'Count' }, { c: 'grep -v -e apple -e banana fruits.txt', n: 'Neither' }, { c: "grep -o '[0-9]\\{3\\}\\.[0-9]\\{1,3\\}\\.[0-9]*\\.[0-9]*' access.log | sort -u", n: 'Extract IPs' }, { c: 'grep -C 1 404 access.log', n: 'Context around an error' }, { c: 'grep -rn hello .', n: 'Recursive search' }, { c: "grep -E ' (4|5)[0-9]{2} ' access.log", n: 'Client/server error lines' }] },
  ],
  quiz: [
