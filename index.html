    { q: 'Count lines that do NOT contain "error":', o: ['grep -c error f', 'grep -vc error f', 'grep -cv error f', 'Both B and C'], a: 3, e: 'Order of combined flags does not matter.' },
    { q: 'grep -r pattern needs a directory because…', o: ['It cannot read files', 'It recurses through files in it', 'It is faster', 'Never needed'], a: 1, e: '-r walks the directory tree.' },
    { q: 'Quiet mode used in if statements:', o: ['-s', '-q', '-Q', '-z'], a: 1, e: '-q returns status 0 on first match.' },
  ],
});

ch2({
  id: 'vars', n: 9, weeks: 'Week 5', title: 'Shell Variables', icon: '💲',
  intro: 'Creating, exporting, expanding and manipulating variables; special variables; arrays.',
  sections: [
    { id: 'basic', h: 'Creating and using variables',
      html: `<p>Assign with <b>no spaces</b> around <code>=</code>: <code>name=Asha</code>. Read with <code>$name</code> or <code>\${name}</code> (braces help in <code>\${name}_x</code>). Names are case-sensitive, letters/digits/underscore, not starting with a digit.</p>
      <ul><li><b>Quotes:</b> single quotes keep everything literal; double quotes allow <code>$var</code> and <code>$(cmd)</code>; <code>\\$</code> escapes one dollar.</li><li><b>Export:</b> a variable is private to the current shell until <code>export</code>ed, after which child processes inherit a <em>copy</em> — changing it in the child never affects the parent.</li><li><b>Remove:</b> <code>unset name</code>.</li><li><b>Inspect:</b> <code>set</code> (all), <code>env</code>/<code>printenv</code> (exported only), <code>declare -p name</code>.</li></ul>`,
      cmds: [['name=value', 'Assign (no spaces!)'], ['echo $name', 'Read'], ['echo "${name}_x"', 'Braces to delimit'], ['export name', 'Make visible to children'], ['unset name', 'Delete'], ['env', 'List exported variables'], ['set', 'List all variables'], ["echo '$HOME'", 'Single quotes: no expansion'], ['echo "$HOME"', 'Double quotes: expands']],
      ex: [{ c: 'name=Asha; echo "Hi $name"; echo \'Hi $name\'', n: 'Quote difference' }, { c: 'echo $USER $HOME $PWD', n: 'Common variables' }, { c: 'x=10; export x; echo $x; unset x; echo "[$x]"', n: 'Export / unset' }, { c: 'echo $HOSTNAME $SHELL', n: 'More built-ins' }] },
    { id: 'special', h: 'Special variables',
      html: `<table class="t"><tr><th>Var</th><th>Meaning</th><th>Var</th><th>Meaning</th></tr>
      <tr><td><code>$0</code></td><td>script name</td><td><code>$1…$9</code></td><td>positional args</td></tr><tr><td><code>$#</code></td><td>number of args</td><td><code>$@</code> <code>$*</code></td><td>all args</td></tr><tr><td><code>$?</code></td><td>last exit status</td><td><code>$$</code></td><td>PID of this shell</td></tr><tr><td><code>$!</code></td><td>PID of last bg job</td><td><code>$-</code></td><td>current shell flags</td></tr><tr><td><code>$PATH</code></td><td>command search path</td><td><code>$RANDOM</code></td><td>random 0–32767</td></tr><tr><td><code>$PS1</code></td><td>prompt string</td><td><code>$IFS</code></td><td>field separator</td></tr></table>
      <p><code>PATH</code> is a colon-separated list; add to it with <code>export PATH=$PATH:$HOME/bin</code>.</p>`,
      cmds: [['echo $$', 'Shell PID'], ['echo $?', 'Last status'], ['echo $-', 'Shell flags'], ['echo $RANDOM', 'Random number'], ['export PATH=$PATH:~/bin', 'Extend PATH']],
      ex: [{ c: 'echo $PATH | tr : "\\n"', n: 'One directory per line' }, { c: 'ls; echo $?', n: 'Exit status' }] },
    { id: 'manip', h: 'Parameter expansion (the ${…} toolbox)',
      html: `<p>Bash can transform values without external tools. Suppose <code>v=hello.world.txt</code>.</p>
      <table class="t"><tr><th>Syntax</th><th>Result / purpose</th></tr>
      <tr><td><code>\${#v}</code></td><td>length → 15</td></tr><tr><td><code>\${v:6:5}</code></td><td>substring from offset 6, length 5 → world</td></tr><tr><td><code>\${v: -3}</code></td><td>last 3 chars (note the space!) → txt</td></tr>
      <tr><td><code>\${v#*.}</code> / <code>\${v##*.}</code></td><td>delete shortest / longest match from the <b>start</b> → world.txt / txt</td></tr><tr><td><code>\${v%.*}</code> / <code>\${v%%.*}</code></td><td>delete shortest / longest match from the <b>end</b> → hello.world / hello</td></tr>
      <tr><td><code>\${v/o/0}</code> / <code>\${v//o/0}</code></td><td>replace first / all</td></tr><tr><td><code>\${v/#he/HE}</code> <code>\${v/%txt/md}</code></td><td>replace at start / end</td></tr>
      <tr><td><code>\${v^^}</code> <code>\${v,,}</code> <code>\${v^}</code></td><td>UPPER / lower / Capitalise first</td></tr>
      <tr><td><code>\${x:-default}</code></td><td>use default if unset/empty</td></tr><tr><td><code>\${x:=default}</code></td><td>assign default if unset</td></tr><tr><td><code>\${x:?message}</code></td><td>error and exit if unset</td></tr><tr><td><code>\${x:+alt}</code></td><td>alt only if x is set</td></tr><tr><td><code>\${!H*}</code></td><td>names of variables starting with H</td></tr></table>`,
      cmds: [['${#v}', 'Length'], ['${v:2:3}', 'Substring'], ['${v##*.}', 'Extension'], ['${v%.*}', 'Strip extension'], ['${v//a/b}', 'Replace all'], ['${v^^}', 'Upper-case'], ['${x:-def}', 'Default value'], ['${x:?msg}', 'Fail if unset']],
      ex: [{ c: 'v=hello.world.txt; echo ${#v} ${v:6:5} ${v: -3}', n: 'Length & slices' }, { c: 'v=hello.world.txt; echo ${v#*.} ${v##*.} ${v%.*} ${v%%.*}', n: 'Prefix/suffix removal' }, { c: 'v=banana; echo ${v/a/A} ${v//a/A} ${v^^}', n: 'Replace & case' }, { c: 'unset x; echo ${x:-fallback}; echo [$x]; echo ${x:=set-now}; echo $x', n: 'Defaults' }] },
    { id: 'declare', h: 'declare, arrays and associative arrays',
      html: `<p><code>declare</code> adds attributes: <code>-i</code> integer, <code>-l</code> force lower, <code>-u</code> force upper, <code>-r</code> read-only (cannot be unset), <code>-a</code> indexed array, <code>-A</code> associative array (like a Python dict), <code>-x</code> export. Use <code>+</code> to remove an attribute (except <code>-r</code>).</p>
      <pre class="diagram">arr=(red green blue)       arr+=(black)         arr[1]=lime
echo \${arr[0]}   \${arr[@]}   \${#arr[@]}   \${!arr[@]}      # item · all · length · indices
unset 'arr[1]'                                              # delete element
files=($(ls))                                               # command output → array
declare -A age; age[asha]=20; age[dev]=22; echo \${age[asha]}; echo \${!age[@]}</pre>`,
      cmds: [['declare -i n=5', 'Integer variable'], ['declare -u s', 'Always upper-case'], ['declare -r c=3', 'Read-only'], ['arr=(a b c)', 'Indexed array'], ['${arr[@]}', 'All elements'], ['${#arr[@]}', 'Array length'], ['${!arr[@]}', 'Indices'], ['arr+=(d)', 'Append'], ['declare -A m', 'Associative array']],
      ex: [{ c: 'arr=(red green blue); echo ${arr[1]} ${#arr[@]} ${arr[@]}', n: 'Basics' }, { c: 'arr=(a b c); arr+=(d); echo ${arr[@]} ${!arr[@]}', n: 'Append, indices' }, { c: 'declare -i n=3; n=n*4; echo $n', n: 'Integer attribute evaluates arithmetic' }] },
  ],
  quiz: [
    { q: 'What is wrong with: x = 5 ?', o: ['Nothing', 'Spaces around = make bash look for a command called x', 'Needs quotes', 'Must use let'], a: 1, e: 'Assignments take no spaces.' },
    { q: 'With v=report.tar.gz, ${v%%.*} gives:', o: ['report', 'report.tar', 'gz', 'tar.gz'], a: 0, e: '%% removes the longest suffix match of .*' },
    { q: 'Which makes a variable visible to child processes?', o: ['set', 'export', 'local', 'declare -i'], a: 1, e: 'export puts it in the environment.' },
    { q: '${arr[@]} versus ${#arr[@]}:', o: ['elements vs count', 'count vs elements', 'both elements', 'indices vs count'], a: 0, e: '# gives the length.' },
    { q: 'Which expands $HOME?', o: ["'$HOME'", '"$HOME"', '\\$HOME', 'None'], a: 1, e: 'Double quotes allow expansion; single quotes do not.' },
    { q: '${x:-hi} when x is unset →', o: ['Sets x=hi and prints', 'Prints hi, x stays unset', 'Error', 'Prints nothing'], a: 1, e: ':= would also assign.' },
  ],
});

ch2({
  id: 'scripting', n: 10, weeks: 'Weeks 6–7', title: 'Shell Scripting', icon: '📜',
  intro: 'Turn commands into programs: shebangs, arguments, tests, conditionals, loops, functions, debugging and getopts.',
  sections: [
    { id: 'run', h: 'Your first script and ways to run it',
      html: `<pre class="diagram">#!/bin/bash                 ← shebang: which interpreter runs this file
# comments start with #
echo "Hello, $USER! I am PID $$"</pre>
      <p>Save as <code>s1.sh</code>, then: <code>bash s1.sh</code> (no exec bit needed), or <code>chmod +x s1.sh &amp;&amp; ./s1.sh</code> (uses the shebang), or <code>source s1.sh</code> / <code>. s1.sh</code>.</p>
      <table class="t"><tr><th></th><th>./s1.sh or bash s1.sh</th><th>source s1.sh</th></tr><tr><td>Runs in</td><td>a new child shell (new PID)</td><td>the <em>current</em> shell</td></tr><tr><td>Variables set inside</td><td>vanish after</td><td>stay</td></tr></table>
      <p><code>echo $0</code> inside the script reveals how it was invoked; <code>ps --forest</code> shows the parent/child relationship.</p>`,
      cmds: [['chmod +x s.sh', 'Make executable'], ['./s.sh', 'Run via shebang'], ['bash s.sh', 'Run with bash explicitly'], ['source s.sh', 'Run in current shell'], ['bash -x s.sh', 'Debug: trace every command'], ['set -x / set +x', 'Trace on / off inside a script'], ['set -e', 'Exit on first error'], ['set -u', 'Error on unset variable']],
      ex: [{ c: 'cat hello.sh', n: 'The sample script' }, { c: 'chmod +x hello.sh && ./hello.sh', n: 'Run it' }, { c: 'bash hello.sh', n: 'No exec bit needed' }] },
    { id: 'args', h: 'Arguments and input',
      html: `<p>Inside a script: <code>$1</code>, <code>$2</code>… are arguments, <code>$#</code> their count, <code>"$@"</code> all of them (each preserved as one word — always quote it), <code>shift</code> drops <code>$1</code>. Read interactively with <code>read -p "Name: " name</code> (<code>-s</code> silent, <code>-t 5</code> timeout). <code>printf</code> gives C-style formatting: <code>printf "%-10s %5.2f\\n" "$n" "$x"</code>.</p>
      <pre class="diagram">#!/bin/bash
if [ $# -lt 1 ]; then echo "Usage: $0 name" >&2; exit 1; fi
echo "Hello $1 — you passed $# args: $@"</pre>`,
      cmds: [['$1 $2 …', 'Positional arguments'], ['$#', 'Argument count'], ['"$@"', 'All args, preserved'], ['shift', 'Drop the first arg'], ['read -p "Q: " v', 'Prompt and read'], ['printf "%s\\n" x', 'Formatted print'], ['echo "msg" >&2', 'Print to stderr']],
      ex: [{ c: 'printf "%-8s|%5d|\\n" abc 42', n: 'printf formatting' }] },
    { id: 'tests', h: 'Conditions: test, [ ] and [[ ]]',
      html: `<p><code>if</code> runs a <em>command</em> and branches on its exit status. <code>[ expr ]</code> is the <code>test</code> command (spaces required!); <code>[[ expr ]]</code> is a bash keyword that is safer (no word-splitting, supports <code>&amp;&amp;</code>, <code>||</code>, <code>=~</code> regex and pattern <code>==</code>).</p>
      <table class="t"><tr><th>Strings</th><th>Numbers</th><th>Files</th></tr><tr><td><code>=</code> <code>!=</code> <code>-z</code> empty <code>-n</code> non-empty</td><td><code>-eq -ne -lt -le -gt -ge</code></td><td><code>-e</code> exists · <code>-f</code> file · <code>-d</code> dir · <code>-r -w -x</code> perms · <code>-s</code> non-empty · <code>-nt</code> newer</td></tr></table>
      <pre class="diagram">if [[ -f "$1" && $2 -gt 10 ]]; then echo big
elif [[ $x =~ ^[0-9]+$ ]]; then echo number
else echo other; fi

if grep -q root /etc/passwd; then echo found; fi      # any command works
(( n % 2 == 0 )) && echo even                           # arithmetic test</pre>`,
      cmds: [['if cmd; then …; fi', 'Branch on exit status'], ['[ -f file ]', 'Regular file exists?'], ['[ -d dir ]', 'Directory exists?'], ['[ "$a" = "$b" ]', 'String equal'], ['[ $n -gt 3 ]', 'Numeric greater'], ['[[ $s =~ regex ]]', 'Regex match'], ['(( expr ))', 'Arithmetic condition'], ['! cmd', 'Negate exit status']],
      ex: [{ c: '[ -f notes.txt ] && echo exists || echo missing', n: 'File test' }, { c: 'x=7; [ $x -gt 5 ] && echo big', n: 'Numeric' }, { c: 'test -d docs; echo $?', n: 'Exit status of test' }] },
    { id: 'case', h: 'case and select',
      html: `<pre class="diagram">case "$1" in
  start|begin) echo starting ;;
  stop)        echo stopping ;;
  [0-9]*)      echo a number ;;
  *)           echo "unknown" ;;
esac

select opt in Red Green Quit; do      # numbered menu, prompt is $PS3
  case $opt in Quit) break ;; *) echo "you chose $opt" ;; esac
done</pre>
      <p>Each branch ends with <code>;;</code> (bash 4 also has <code>;&amp;</code> fall-through and <code>;;&amp;</code>).</p>`,
      cmds: [['case $v in p) …;; esac', 'Pattern switch'], ['select o in a b; do …; done', 'Menu loop'], ['PS3="Choose: "', 'Prompt for select']],
      ex: [] },
    { id: 'loops', h: 'Loops: for, while, until',
      html: `<pre class="diagram">for f in *.txt; do echo "$f has $(wc -l < "$f") lines"; done
for i in {1..5}; do echo $i; done
for ((i=0; i&lt;3; i++)); do echo $i; done
while read -r line; do echo "&gt; $line"; done &lt; fruits.txt
n=3; until [ $n -eq 0 ]; do echo $n; ((n--)); done</pre>
      <p><code>break [n]</code> leaves loop(s), <code>continue</code> skips to the next iteration. <b>IFS</b> (Internal Field Separator, default space/tab/newline) controls word splitting: <code>IFS=: read -r a b &lt; file</code> or <code>IFS=,</code> to split on commas. Redirect a whole loop: <code>done &gt; out.txt</code>. Measure with <code>time cmd</code>.</p>`,
      cmds: [['for v in list; do …; done', 'Iterate over words'], ['for ((i=0;i<n;i++))', 'C-style loop'], ['while cond; do …; done', 'Loop while true'], ['until cond; do …; done', 'Loop until true'], ['while read -r l; do …; done < f', 'Process a file line by line'], ['break / continue', 'Leave / skip iteration'], ['IFS=: ', 'Change field separator'], ['time cmd', 'Measure run time']],
      ex: [{ c: 'for i in {1..3}; do echo "Line $i"; done', n: 'Range loop' }, { c: 'for f in *.txt; do echo $f; done', n: 'Glob loop' }, { c: 'i=0; while [ $i -lt 3 ]; do echo $i; i=$((i+1)); done', n: 'while' }, { c: 'for ((i=1;i<=3;i++)); do echo $((i*i)); done', n: 'C-style' }, { c: 'while read -r l; do echo "> $l"; done < docs/todo.txt', n: 'Read a file' }] },
    { id: 'func', h: 'Functions, arithmetic, eval and getopts',
      html: `<pre class="diagram">greet() { local who=\${1:-world}; echo "Hello, $who"; return 0; }
greet Asha                     # call; args become $1.. inside
result=$(greet Dev)            # capture output
fact() { (( $1 <= 1 )) && echo 1 || echo $(( $1 * $(fact $(( $1 - 1 )) ) )); }   # recursion</pre>
      <p><b>Arithmetic:</b> <code>$((a*b))</code>, <code>((i++))</code>, <code>let x=3+4</code>, <code>expr 3 + 4</code> (old), and floats via <code>echo "scale=2; 22/7" | bc</code>. <b>Debugging:</b> <code>set -x</code>. <b>Dynamic execution:</b> <code>eval "cmd"</code> parses a string as code (powerful, risky), <code>exec cmd</code> replaces the shell with cmd, <code>source f</code> runs in the current shell.</p>
      <p><b>getopts</b> parses flags: <code>while getopts "a:vh" o; do case $o in a) A=$OPTARG;; v) V=1;; h) usage;; esac; done; shift $((OPTIND-1))</code>. Startup files: <code>~/.bash_profile</code> (login shells), <code>~/.bashrc</code> (interactive non-login) — put aliases and exports there.</p>`,
      cmds: [['f() { …; }', 'Define a function'], ['local x', 'Function-local variable'], ['return n', 'Function exit status'], ['$(( a + b ))', 'Integer math'], ['echo "scale=2;22/7" | bc', 'Floating point'], ['eval "$cmd"', 'Execute a string'], ['exec cmd', 'Replace shell'], ['getopts "ab:" o', 'Parse options'], ['source ~/.bashrc', 'Reload config']],
      ex: [{ c: 'echo "scale=3; 22/7" | bc', n: 'bc truncates to the chosen scale' }, { c: 'echo $((2**10)) $((17%5)) $((7/2))', n: 'Integer arithmetic' }, { c: 'expr 6 \\* 7', n: 'expr' }] },
  ],
  quiz: [
    { q: 'Why does a variable set in ./s.sh disappear but not with source s.sh?', o: ['source is faster', 'The script runs in a child shell otherwise', 'Variables are read-only', 'Bash bug'], a: 1, e: 'Child shells cannot modify the parent environment.' },
    { q: 'Which is the safest way to pass all args on?', o: ['$*', '$@', '"$@"', '$#'], a: 2, e: '"$@" preserves each argument as a single word.' },
    { q: '[ $x = yes ] fails with empty x because…', o: ['x must be set', 'The test becomes [ = yes ] — quote variables', 'yes is reserved', 'It needs -eq'], a: 1, e: 'Always quote: [ "$x" = yes ] or use [[ ]].' },
    { q: 'Which line makes the script stop on the first failing command?', o: ['set -x', 'set -e', 'set -u', 'set +e'], a: 1, e: '-x traces, -u flags unset vars.' },
    { q: 'What ends a case branch?', o: ['break', ';;', 'esac', 'fi'], a: 1, e: ';; ends the branch; esac ends the whole case.' },
    { q: 'getopts "a:v" accepts…', o: ['-a with a value and -v flag', '-a flag and -v value', 'only long options', 'positional arguments only'], a: 0, e: 'A colon after a letter means it takes an argument.' },
  ],
});
</script><script>const ch3 = (o) => window.CH.push(o);

ch3({
  id: 'sed', n: 11, weeks: 'Week 8', title: 'sed: the Stream Editor', icon: '🪄',
  intro: 'Edit streams non-interactively: addresses, substitution, deletion, insertion, scripts and branching.',
  sections: [
    { id: 'basic', h: 'How sed thinks',
      html: `<p>sed reads input <b>one line at a time</b> into a <em>pattern space</em>, applies your commands, and prints the result — then moves on. By default it prints every line (edited or not); <code>-n</code> turns that off so only explicit <code>p</code> prints. Shape of a command: <code>[address[,address]][!]command</code>.</p>
      <pre class="diagram">sed -n '2p' f           print line 2 only        sed '2d' f        delete line 2
sed -n '2,4p' f         lines 2-4                sed '$d' f        delete last line
sed -n '1~2p' f         every 2nd line from 1    sed -n '$=' f     count lines
sed -n '/re/p' f        lines matching re        sed '/re/d' f     delete matches
sed -n '/a/,/b/p' f     range between regexes    sed '2,+2d' f     line 2 and next 2
sed '2!d' f             delete all except 2      sed = f           print line numbers</pre>
      <p>Always quote the script with <b>single quotes</b> so the shell does not touch <code>$</code> or <code>!</code>. Several commands: <code>-e 'cmd1' -e 'cmd2'</code> or <code>cmd1; cmd2</code>, grouped with <code>{ }</code>: <code>/re/{s/a/b/;p}</code>.</p>`,
      cmds: [["sed -n '3p' f", 'Print line 3'], ["sed -n '2,4p' f", 'Lines 2–4'], ["sed -n '$p' f", 'Last line'], ["sed '1d' f", 'Delete first line'], ["sed '/^$/d' f", 'Delete empty lines'], ["sed -n '/re/p' f", 'Print matching lines'], ["sed -n '/a/,/b/p' f", 'Between two patterns'], ["sed -n '1~2p' f", 'Odd lines'], ["sed = f", 'Interleave line numbers']],
      ex: [{ c: "sed -n '2,3p' fruits.txt", n: 'Range' }, { c: "sed '1d' scores.csv | head -n 2", n: 'Drop the header' }, { c: "sed -n '/apple/p' fruits.txt", n: 'Same as grep' }, { c: "sed -n '/banana/,/date/p' fruits.txt", n: 'Between patterns' }, { c: "sed -n '1~2p' fruits.txt", n: 'Every other line' }, { c: "sed -n '$=' fruits.txt", n: 'Count lines' }] },
    { id: 's', h: 'Substitution: s/old/new/flags',
      html: `<p>The workhorse: <code>s/regex/replacement/flags</code>. Flags: <code>g</code> all occurrences, <code>N</code> the Nth, <code>p</code> print if changed (with <code>-n</code>), <code>i</code> ignore case. In the replacement, <code>&amp;</code> is the whole match and <code>\\1…\\9</code> are captured groups. Any character can be the delimiter: <code>s|/usr/bin|/bin|</code> avoids escaping slashes. Use <code>-E</code> for extended regex (no backslashes on <code>( ) + ? |</code>).</p>
      <pre class="diagram">sed 's/cat/dog/g' f                   all occurrences on every line
sed -E 's/([a-z]+)@([a-z.]+)/\\2: \\1/' f     swap with groups
sed 's/.*/"&amp;"/' f                      wrap each line in quotes
sed 's/^/&gt; /' f   ·  sed 's/$/;/' f      prefix / suffix every line
sed -i.bak 's/old/new/g' f              edit file in place (keeps f.bak)</pre>`,
      cmds: [["sed 's/a/b/' f", 'First a→b on each line'], ["sed 's/a/b/g' f", 'All'], ["sed 's/a/b/2' f", 'Second occurrence only'], ["sed -E 's/(x)(y)/\\2\\1/' f", 'Groups'], ["sed 's/.*/<&>/' f", '& = whole match'], ["sed 's|/a|/b|' f", 'Custom delimiter'], ["sed -i 's/a/b/g' f", 'In-place edit'], ["sed -i.bak 's/a/b/g' f", 'In-place + backup'], ["sed 's/[0-9]//g' f", 'Remove digits'], ["sed 's/^[ \\t]*//' f", 'Trim leading spaces']],
      ex: [{ c: "sed 's/apple/APPLE/g' fruits.txt | head -n 4", n: 'Replace' }, { c: "sed -E 's/^([a-z]+)@([a-z.]+)$/\\2 :: \\1/' emails.txt", n: 'Reorder with groups' }, { c: "sed 's/.*/<&>/' fruits.txt | head -n 2", n: 'Using &' }, { c: "sed 's/^/# /' todo.txt 2>/dev/null; sed 's/^/# /' docs/todo.txt", n: 'Comment out lines' }, { c: "sed -i 's/banana/BANANA/' fruits.txt; head -n 2 fruits.txt", n: 'In place (simulated)' }] },
    { id: 'aic', h: 'Insert, append, change, transliterate',
      html: `<pre class="diagram">sed '2i\\New line before 2' f        i = insert before
sed '2a\\New line after 2' f         a = append after
sed '2c\\Replace line 2' f           c = change (replace) line
sed '/re/a\\Added after each match' f
sed '1i\\HEADER' f | sed '$a\\FOOTER'   header and footer
sed 'y/abc/ABC/' f                  transliterate characters (like tr)</pre>
      <p>Other commands: <code>q</code> quit (<code>5q</code> = print five lines), <code>n</code>/<code>N</code> read the next line into the pattern space (join lines: <code>sed 'N;s/\\n/ /'</code>), <code>h/H/g/G/x</code> hold-space copy/append/get/swap (reverse a file: <code>sed -n '1!G;h;$p'</code>).</p>`,
      cmds: [["sed '2i\\text' f", 'Insert before line 2'], ["sed '2a\\text' f", 'Append after line 2'], ["sed '2c\\text' f", 'Change line 2'], ["sed '$a text' f", 'Add a footer'], ["sed '1i\\header' f", 'Add a header'], ["sed 'y/abc/xyz/' f", 'Transliterate'], ["sed 5q f", 'Quit after 5 lines'], ["sed 'N;s/\\n/ /' f", 'Join pairs of lines'], ["sed -n '1!G;h;$p' f", 'Reverse the file (tac)']],
      ex: [{ c: "sed '1i\\FRUITS' fruits.txt | head -n 3", n: 'Header' }, { c: "sed '$a\\--end--' fruits.txt | tail -n 2", n: 'Footer' }, { c: "sed '/fig/c\\FIG!' fruits.txt | tail -n 2", n: 'Change a matched line' }, { c: "sed 'N;s/\\n/ + /' fruits.txt", n: 'Join pairs' }, { c: "sed -n '1!G;h;$p' fruits.txt | head -n 3", n: 'Reverse using the hold space' }] },
    { id: 'script', h: 'sed scripts and flow control',
      html: `<p>Put commands in a file and run <code>sed -f script.sed input</code>, or use a shebang <code>#!/bin/sed -f</code>. Commands run in order for each line. <b>Labels</b> (<code>:a</code>) with <code>b</code> (branch) and <code>t</code> (branch if a substitution succeeded) make loops: <code>sed ':a;s/^\\([^,]*\\),/\\1;/;ta'</code> replaces every comma. The classic "join continuation lines": <code>sed -e :a -e '/\\\\$/N; s/\\\\\\n//; ta'</code>.</p>`,
      cmds: [['sed -f script.sed f', 'Run a script file'], [':label', 'Define a label'], ['b label', 'Branch unconditionally'], ['t label', 'Branch if s/// succeeded'], ['{ cmd1; cmd2 }', 'Group commands']],
      ex: [] },
  ],
  quiz: [
    { q: 'sed -n "3p" prints…', o: ['Everything', 'Only line 3', 'All except line 3', 'Three lines'], a: 1, e: '-n suppresses auto-print.' },
    { q: 'Which edits a file in place and keeps a backup?', o: ['sed -b', 'sed -i.bak', 'sed -w', 'sed >f'], a: 1, e: '-i.bak writes changes and saves f.bak.' },
    { q: 'In s/(a)(b)/\\2\\1/ with -E the result for "ab" is:', o: ['ab', 'ba', '\\2\\1', 'aa'], a: 1, e: 'Groups are swapped.' },
    { q: "sed '2,4d' deletes…", o: ['line 2 and 4', 'lines 2 through 4', 'lines 2 to 4 not', 'all but 2-4'], a: 1, e: 'An address range is inclusive.' },
    { q: 'Which command adds a footer line?', o: ["sed '$a text'", "sed '1i text'", "sed 'c text'", "sed 'y/a/t/'"], a: 0, e: '$ = last line, a = append.' },
  ],
});

ch3({
  id: 'awk', n: 12, weeks: 'Week 9', title: 'AWK Programming', icon: '🦅',
  intro: 'A full pattern-action language for column-oriented text: fields, variables, arrays, functions and reports.',
  sections: [
    { id: 'model', h: 'Execution model and syntax',
      html: `<p>AWK (Aho, Weinberger, Kernighan) reads input as <b>records</b> (lines, split on <code>RS</code>) made of <b>fields</b> (split on <code>FS</code>, default whitespace). For each record it checks every <code>pattern { action }</code> rule:</p>
      <pre class="diagram">BEGIN { …runs once before input… }
pattern { action }          ← runs for each line where pattern is true
{ action }                  ← no pattern: every line
pattern                     ← no action: print the line
END   { …runs once after input… }</pre>
      <p>Fields: <code>$0</code> whole line, <code>$1</code> first, <code>$NF</code> last, <code>$(NF-1)</code> second to last. Patterns can be <code>/regex/</code>, comparisons (<code>$3 &gt; 50</code>), <code>NR==2</code>, ranges <code>NR==2,NR==4</code> or <code>/start/,/end/</code>, and combinations with <code>&amp;&amp; || !</code>. Choose a separator with <code>-F:</code> or <code>BEGIN{FS=","}</code>; the FS can be a regex: <code>-F'[ .;:-]'</code>. Run a script file with <code>awk -f prog.awk file</code>; with <code>#!/usr/bin/awk -f</code> as shebang it becomes executable.</p>
      <p class="cta">👉 Try programs in the <a href="#" data-go="playground:awk">AWK Playground</a>.</p>`,
      cmds: [["awk '{print $1}' f", 'First column'], ["awk '{print $NF}' f", 'Last column'], ["awk -F, '{print $2}' f", 'CSV column'], ["awk 'NR==2' f", 'Line 2'], ["awk 'NR>1' f", 'Skip header'], ["awk '/re/' f", 'Lines matching regex'], ["awk '$3>50' f", 'Numeric condition'], ["awk '$1 ~ /^A/' f", 'Field matches regex'], ["awk 'END{print NR}' f", 'Count lines'], ["awk 'NR==2,NR==4' f", 'Range']],
      ex: [{ c: "awk '{print $2, $4}' employees.txt", n: 'Columns' }, { c: "awk '$4 > 50000 {print $2}' employees.txt", n: 'Filter' }, { c: "awk -F, 'NR>1{print $1\": \"$3}' scores.csv", n: 'CSV' }, { c: "awk 'NR==2,NR==4' employees.txt", n: 'Range' }, { c: "awk '/Sales/ {n++} END {print n\" in sales\"}' employees.txt", n: 'Count matches' }] },
    { id: 'builtin', h: 'Built-in variables',
      html: `<table class="t"><tr><th>Var</th><th>Meaning</th><th>Var</th><th>Meaning</th></tr>
      <tr><td><code>NR</code></td><td>record number (all files)</td><td><code>FNR</code></td><td>record number in current file</td></tr>
      <tr><td><code>NF</code></td><td>fields in this record</td><td><code>FS</code></td><td>input field separator</td></tr>
      <tr><td><code>OFS</code></td><td>output field separator</td><td><code>ORS</code></td><td>output record separator</td></tr>
      <tr><td><code>RS</code></td><td>input record separator</td><td><code>FILENAME</code></td><td>current input file</td></tr>
      <tr><td><code>ARGC</code> <code>ARGV</code></td><td>argument count / array</td><td><code>ENVIRON</code></td><td>environment array</td></tr>
      <tr><td><code>RSTART</code> <code>RLENGTH</code></td><td>set by <code>match()</code></td><td><code>SUBSEP</code></td><td>multi-dim array key joiner</td></tr><tr><td><code>OFMT</code></td><td>number output format</td><td></td><td></td></tr></table>
      <p>Note: assigning to a field (<code>$2="X"</code>) makes AWK rebuild <code>$0</code> using <code>OFS</code> — a handy way to reformat columns: <code>awk 'BEGIN{OFS=","}{$1=$1}1'</code> converts whitespace to CSV.</p>`,
      cmds: [["awk 'BEGIN{OFS=\",\"}{$1=$1}1' f", 'Whitespace → CSV'], ["awk '{print NR, NF}' f", 'Line # and field count'], ["awk '{print FILENAME}' f", 'File name'], ["awk 'BEGIN{ORS=\"\\n\\n\"}{print}' f", 'Double-space output'], ["awk 'BEGIN{print ENVIRON[\"HOME\"]}'", 'Environment lookup']],
      ex: [{ c: "awk '{print NR\": \"NF\" fields\"}' employees.txt | head -n 2", n: 'NR and NF' }, { c: "awk 'BEGIN{OFS=\",\"}{$1=$1}1' employees.txt | head -n 2", n: 'OFS trick' }, { c: "awk 'BEGIN{print ENVIRON[\"HOME\"]}'", n: 'ENVIRON' }] },
    { id: 'vars', h: 'Variables, arrays and control flow',
      html: `<p>Variables are untyped and start at <code>""</code>/<code>0</code>; strings that look numeric act as numbers. <b>Arrays are associative</b> (keys are strings): <code>a["x"]=1</code>, test with <code>("x" in a)</code>, iterate with <code>for (k in a)</code>, remove with <code>delete a[k]</code>. Multidimensional: <code>a[i,j]</code>.</p>
      <pre class="diagram">{ sum[$3] += $4; cnt[$3]++ }                        group-by
END { for (d in sum) printf "%-12s %8.2f\\n", d, sum[d]/cnt[d] }

!seen[$0]++                                        print each line the first time (dedupe)
{ if ($4 &gt; 50000) print $2, "high"; else print $2, "low" }
{ print ($4 &gt; 50000 ? "high" : "low") }           ternary
BEGIN { while (i &lt; 3) print ++i }   BEGIN { for (i=1;i&lt;=3;i++) s = s i; print s }</pre>
      <p>Control: <code>if/else</code>, <code>while</code>, <code>do…while</code>, C-style <code>for</code>, <code>for (k in a)</code>, <code>break</code>, <code>continue</code>, <code>next</code> (skip to next record), <code>exit</code>. Pass shell values with <code>-v name=value</code>.</p>`,
      cmds: [["awk '{s+=$4} END{print s}' f", 'Sum a column'], ["awk '{s+=$4} END{print s/NR}' f", 'Average'], ["awk '{c[$3]++} END{for(k in c)print k,c[k]}' f", 'Frequency table'], ["awk '!seen[$0]++' f", 'Remove duplicates'], ["awk 'max<$4{max=$4}END{print max}' f", 'Maximum'], ["awk -v lim=50000 '$4>lim' f", 'Pass a variable'], ['awk \'{print ($4>50000?"high":"low")}\' f', 'Ternary']],
      ex: [{ c: "awk '{s+=$4} END{print \"total\", s, \"avg\", s/NR}' employees.txt", n: 'Total & average' }, { c: "awk '{sum[$3]+=$4; n[$3]++} END{for(d in sum) printf \"%-12s avg %.1f\\n\", d, sum[d]/n[d]}' employees.txt", n: 'Group-by' }, { c: "awk '!seen[$0]++' fruits.txt", n: 'Dedupe, order kept' }, { c: "awk -v lim=55000 '$4>lim{print $2}' employees.txt", n: '-v' }, { c: "awk 'NR==1{m=$4} $4>m{m=$4} END{print \"max\", m}' employees.txt", n: 'Maximum' }] },
    { id: 'funcs', h: 'Functions and printf',
      html: `<table class="t"><tr><th>String</th><th>Math</th><th>Other</th></tr><tr><td><code>length(s)</code> <code>substr(s,i,n)</code> <code>index(s,t)</code> <code>split(s,a,sep)</code> <code>sub(re,r)</code> <code>gsub(re,r)</code> <code>match(s,re)</code> <code>toupper</code> <code>tolower</code> <code>sprintf</code></td><td><code>int sqrt exp log sin cos atan2 rand srand</code></td><td><code>getline</code> · <code>system("cmd")</code> · <code>cmd | getline v</code> · <code>close()</code></td></tr></table>
      <p><b>printf</b> formats: <code>%s %d %f %.2f %5d %-10s %c %x %e %%</code>. Define your own: <code>function sq(x){ return x*x }</code> — parameters are local if passed, arrays by reference. Load libraries with several <code>-f</code>: <code>awk -f lib.awk -f main.awk</code>. Comments start with <code>#</code>.</p>
      <pre class="diagram"># payroll.awk
BEGIN { printf "%-10s %10s\\n", "Name", "Salary"; print "-----------------------" }
$4 &gt; 0 { printf "%-10s %10.2f\\n", $2, $4*1.1; total += $4*1.1 }
END   { printf "%-10s %10.2f\\n", "TOTAL", total }</pre>`,
      cmds: [['length($2)', 'String length'], ['substr($2,1,3)', 'First 3 chars'], ['toupper($2)', 'Upper-case'], ['split(s,a,",")', 'Split into array'], ['gsub(/a/,"A")', 'Replace all in $0'], ['match($0,/[0-9]+/)', 'Find regex; sets RSTART'], ['printf "%5.2f\\n", x', 'Formatted output'], ['sprintf("%03d", n)', 'Format into a string'], ['function f(x){return x*x}', 'User function']],
      ex: [{ c: "awk '{print toupper(substr($2,1,1)) substr($2,2), length($2)}' employees.txt | head -n 3", n: 'String functions' }, { c: "awk '{printf \"%-10s %8.2f\\n\", $2, $4*1.1}' employees.txt", n: 'printf report' }, { c: "awk 'function sq(x){return x*x} BEGIN{for(i=1;i<=5;i++) printf sq(i) \" \"; print \"\"}'", n: 'User function' }, { c: "awk '{gsub(/[aeiou]/,\"_\"); print}' fruits.txt | head -n 3", n: 'gsub' }, { c: "awk 'BEGIN{n=split(\"a,b,c\",arr,\",\"); for(i=n;i>0;i--) print arr[i]}'", n: 'split' }, { c: "awk '{print match($0,/[0-9]+/), RSTART, RLENGTH}' access.log | head -n 2", n: 'match' }] },
    { id: 'real', h: 'Real-world recipes',
      html: `<p>AWK shines on large text files — a spreadsheet may choke on a million rows, awk streams through them. Typical log analysis:</p>
      <pre class="diagram">awk '{print $1}' access.log | sort | uniq -c | sort -rn | head      top IPs
awk '$9 ~ /^5/' access.log                                       server errors
awk '{bytes[$1]+=$NF} END{for(i in bytes) print i, bytes[i]}' access.log
awk -F, 'NR>1 {sum[$2]+=$3; n[$2]++} END{for(s in sum) print s, sum[s]/n[s]}' scores.csv
cmd | awk '...'                                                  use in any pipeline
date --date="5 days ago" +%d/%m/%Y                                date arithmetic helper
sort -n -k2 | sort -rn                                           numeric / reverse sort
dig +noall +answer example.com | awk '{print $NF}'               DNS answer → IP</pre>`,
      cmds: [["sort -rn", 'Numeric reverse sort'], ['date --date="5 days ago" +%F', 'Relative date'], ['dig +noall +answer d', 'Short DNS answer']],
      ex: [{ c: "awk -F, 'NR>1{s[$2]+=$3; n[$2]++} END{for(k in s) printf \"%-10s %.1f\\n\", k, s[k]/n[k]}' scores.csv", n: 'Average marks per subject' }, { c: "awk '$9>=400' access.log | wc -l", n: 'Fields in the quoted log: $9 is the status? check with next command' }, { c: "awk '{print $9}' access.log | sort | uniq -c", n: 'HTTP status distribution' }, { c: "awk '{b[$1]+=$NF} END{for(i in b) print i, b[i]}' access.log | sort", n: 'Bytes per client' }] },
  ],
  quiz: [
    { q: "awk 'NR>1{print $2}' skips…", o: ['Nothing', 'The first line', 'The last line', 'Empty lines'], a: 1, e: 'NR is the record number.' },
    { q: 'What does `!seen[$0]++` do?', o: ['Counts lines', 'Prints a line only the first time it appears', 'Sorts', 'Deletes the file'], a: 1, e: 'seen[$0] is 0 (false) the first time, then incremented.' },
    { q: 'Which block runs after all input is read?', o: ['BEGIN', 'END', 'FINISH', 'LAST'], a: 1, e: 'END.' },
    { q: 'How do you use comma as input field separator?', o: ['awk -F, ...', "awk -f, ...", 'awk FS=, ...', 'Both A and BEGIN{FS=","}'], a: 3, e: '-F, or BEGIN{FS=","}.' },
    { q: 'In awk, arrays are…', o: ['Fixed-size integer indexed', 'Associative (string keys)', 'Not supported', 'Read-only'], a: 1, e: 'Like Python dicts.' },
    { q: 'What does $NF mean?', o: ['Next field', 'Last field of the record', 'Number of files', 'Null field'], a: 1, e: 'NF = number of fields so $NF is the last.' },
  ],
});

ch3({
  id: 'utils', n: 13, weeks: 'Weeks 6 & 8', title: 'Utilities & Automation', icon: '🧰',
  intro: 'find, tar and compression, make, scheduling with cron and at, and startup scripts.',
  sections: [
    { id: 'find', h: 'find: locate files by property',
      html: `<p><code>find where tests actions</code>. Common tests: <code>-name 'pat'</code> (glob, case-sensitive; <code>-iname</code> ignores case), <code>-type f|d|l</code>, <code>-size +10M</code>, <code>-mtime -2</code> (modified within 2 days), <code>-mtime +30</code> (older than 30 days), <code>-perm</code>, <code>-user</code>, <code>-regex</code>. Actions: <code>-print</code> (default), <code>-delete</code>, <code>-exec cmd {} \\;</code> (one run per file) or <code>-exec cmd {} +</code> (batched).</p>`,
      cmds: [["find . -name '*.txt'", 'By name'], ['find . -type d', 'Directories only'], ['find . -size +10M', 'Bigger than 10 MB'], ['find . -mtime -2', 'Changed in last 2 days'], ['find . -mtime +30', 'Older than 30 days'], ["find . -name '*.jpg' -exec ls -lh {} \\;", 'Run a command on each'], ['find $HOME | wc -l', 'Count files in home'], ['du -sh dir', 'Disk usage of a folder']],
      ex: [{ c: "find . -name '*.txt'", n: 'All .txt' }, { c: 'find . -type d', n: 'Directories' }, { c: "find /etc -name 'p*'", n: 'In /etc' }, { c: 'find . | wc -l', n: 'Count everything' }] },
    { id: 'tar', h: 'tar and compression',
      html: `<p><b>tar</b> bundles many files into one archive (no compression); compressors then shrink it. <code>tar -cvf a.tar dir/</code> (create, verbose, file), <code>tar -tf a.tar</code> (list), <code>tar -xvf a.tar</code> (extract), add <code>-z</code> for gzip (<code>.tar.gz</code>), <code>-j</code> bzip2, <code>-J</code> xz.</p>
      <table class="t"><tr><th>Tool</th><th>Speed</th><th>Ratio</th><th>Decompress</th></tr><tr><td>compress (.Z)</td><td>fastest</td><td>lowest</td><td>uncompress</td></tr><tr><td>gzip (.gz)</td><td>fast</td><td>good</td><td>gunzip / gzip -d</td></tr><tr><td>bzip2 (.bz2)</td><td>slower</td><td>better</td><td>bunzip2 / bzip2 -d</td></tr><tr><td>xz / 7z</td><td>slowest</td><td>best</td><td>unxz / 7z x</td></tr></table>`,
      cmds: [['tar -cvf a.tar dir/', 'Create archive'], ['tar -tf a.tar', 'List contents'], ['tar -xvf a.tar', 'Extract'], ['tar -czvf a.tar.gz dir/', 'Create + gzip'], ['tar -xzvf a.tar.gz', 'Extract .tar.gz'], ['gzip f', 'Compress f → f.gz'], ['gunzip f.gz', 'Decompress'], ['zip -r a.zip dir/', 'Zip'], ['unzip a.zip', 'Unzip']],
      ex: [] },
    { id: 'make', h: 'make',
      html: `<p><b>make</b> rebuilds targets only when their dependencies changed. A <code>Makefile</code> rule is <code>target: dependencies</code> followed by a <b>tab-indented</b> recipe. It is also a handy task runner — e.g. a <code>backup:</code> target that tars your project.</p>
      <pre class="diagram">backup:
	tar -czf backup-$$(date +%F).tar.gz src/

clean:
	rm -f *.o</pre>`,
      cmds: [['make', 'Build the first target'], ['make backup', 'Run a named target'], ['make -n', 'Dry run']],
      ex: [] },
    { id: 'cron', h: 'Scheduling: cron and at',
      html: `<p>Edit your schedule with <code>crontab -e</code>, list with <code>crontab -l</code>. Five time fields then the command:</p>
      <pre class="diagram">┌ minute (0-59)
│ ┌ hour (0-23)
│ │ ┌ day of month (1-31)
│ │ │ ┌ month (1-12)
│ │ │ │ ┌ day of week (0-7, Sun=0/7)
* * * * *  command
30 2 * * 1-5   /home/student/backup.sh        02:30 on weekdays
*/15 * * * *   date >> /tmp/clock.log           every 15 minutes
@reboot        /home/student/start.sh          at boot</pre>
      <p><code>at 17:30</code> (then type commands, <kbd>Ctrl+D</kbd>) runs a job once; <code>atq</code> lists and <code>atrm</code> removes. Use absolute paths in cron and remember its environment is minimal. Startup scripts: <code>~/.bashrc</code>, <code>/etc/rc.local</code>, systemd units.</p>`,
      cmds: [['crontab -e', 'Edit your cron jobs'], ['crontab -l', 'List them'], ['at 17:30', 'Schedule one-off job'], ['atq', 'List at jobs'], ['*/5 * * * * cmd', 'Every 5 minutes'], ['@reboot cmd', 'At startup']],
      ex: [] },
  ],
  quiz: [
    { q: 'find . -mtime +30 matches files…', o: ['Modified in last 30 days', 'Modified more than 30 days ago', 'Larger than 30 MB', 'Owned by uid 30'], a: 1, e: '+n = older than n days.' },
    { q: 'Create a gzip-compressed tar:', o: ['tar -cvf a.gz d', 'tar -czvf a.tar.gz d', 'gzip -t d', 'tar -x d'], a: 1, e: '-z invokes gzip.' },
    { q: 'Cron: "0 9 * * 1" runs…', o: ['Every minute', 'Mondays at 09:00', 'On the 1st at 9:00', 'Daily at 9:01'], a: 1, e: 'Day-of-week 1 = Monday.' },
    { q: 'Which compressor usually gives the best ratio (slowest)?', o: ['compress', 'gzip', 'xz', 'zip'], a: 2, e: 'xz/7z trade speed for size.' },
  ],
});

ch3({
  id: 'extras', n: 14, weeks: 'Week 10', title: 'Version Control, Hardware, Prompts & Storage', icon: '🗄️',
  intro: 'The final week: Git fundamentals, inspecting hardware, customising your prompt and managing disks and RAID.',
  sections: [
    { id: 'git', h: 'Version control with Git',
      html: `<p>A <b>version control system</b> records every change so you can compare, revert and collaborate. <b>Git</b> is distributed: every clone holds the full history. Three areas: <em>working tree</em> → (<code>git add</code>) → <em>staging area</em> → (<code>git commit</code>) → <em>repository</em>; <code>push</code>/<code>pull</code> sync with a remote such as GitHub.</p>
      <pre class="diagram">git config --global user.name "Your Name"
git config --global user.email "you@example.com"
git init                      # new repo           git clone URL      # copy a repo
git status                    # what changed       git diff           # unstaged changes
git add file | git add .      # stage              git commit -m "message"
git log --oneline --graph     # history            git restore file   # discard edits
git branch feature            # create branch      git switch feature # change branch
git merge feature             # merge into current git push origin main / git pull</pre>
      <p>For HTTPS pushes GitHub requires a <b>personal access token</b> instead of a password (and 2-factor authentication). Merge conflicts show <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code> markers: edit, <code>git add</code>, then commit. <code>.gitignore</code> lists files to skip; avoid special characters in repo names.</p>`,
      cmds: [['git init', 'Create a repo'], ['git clone url', 'Copy a remote repo'], ['git status', 'Show changes'], ['git add .', 'Stage everything'], ['git commit -m "msg"', 'Record a snapshot'], ['git log --oneline', 'Compact history'], ['git branch name', 'New branch'], ['git switch name', 'Change branch'], ['git merge name', 'Merge branch'], ['git push origin main', 'Upload commits'], ['git pull', 'Fetch + merge']],

function complete() {
  const v = term.input.value; const parts = v.split(/\s+/); const last = parts[parts.length - 1]; let cands = [];
  if (parts.length === 1) cands = Object.keys(sh.C).filter(c => c.startsWith(last));
  else { const i = last.lastIndexOf('/'); const dir = i >= 0 ? last.slice(0, i + 1) : ''; const pre = last.slice(i + 1); const d = sh.get(dir || '.'); if (d && d.t === 'd') cands = Object.keys(d.c).filter(c => c.startsWith(pre)).map(c => dir + c + (d.c[c.split('/').pop()].t === 'd' ? '/' : '')); }
  if (cands.length === 1) { parts[parts.length - 1] = cands[0]; term.input.value = parts.join(' ') + (cands[0].endsWith('/') ? '' : ' '); }
  else if (cands.length > 1) { tprint(promptHTML() + esc(v)); tprint(esc(cands.join('  '))); let p = cands[0]; for (const c of cands) while (!c.startsWith(p)) p = p.slice(0, -1); if (p.length > last.length) { parts[parts.length - 1] = p; term.input.value = parts.join(' '); } }

function initTerminal() {

    else if (e.key === 'ArrowUp') { e.preventDefault(); if (term.hi > 0) term.input.value = term.hist[--term.hi]; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); term.input.value = term.hi < term.hist.length - 1 ? term.hist[++term.hi] : (term.hi = term.hist.length, ''); }

function cidr(s) {
  const m = /^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/.exec(s.trim()); if (!m) return 'Enter an address like 10.0.0.0/8';
  const o = m.slice(1, 5).map(Number), n = +m[5]; if (o.some(x => x > 255) || n > 32) return 'Invalid address';
  const ip = ((o[0] << 24) | (o[1] << 16) | (o[2] << 8) | o[3]) >>> 0; const mask = n === 0 ? 0 : (0xFFFFFFFF << (32 - n)) >>> 0; const net = (ip & mask) >>> 0, bc = (net | (~mask >>> 0)) >>> 0;

  const hosts = n >= 31 ? (n === 32 ? 1 : 2) : Math.pow(2, 32 - n) - 2;
  return `Network    ${f(net)}/${n}\nMask       ${f(mask)}\nBroadcast  ${f(bc)}\nUsable     ${n >= 31 ? f(net) + ' …' : f(net + 1) + ' – ' + f(bc - 1)}\nHosts      ${hosts.toLocaleString()}`;
}

function buildQuiz(host, qs, onFinish) {
  let score = 0, answered = 0;
  host.innerHTML = qs.map((q, i) => `<div class="q" data-i="${i}"><p>${i + 1}. ${esc(q.q)}</p>${q.code ? `<pre class="qcode">${esc(q.code)}</pre>` : ''}<div class="opts">${q.o.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div><div class="why" hidden></div></div>`).join('') + `<div class="row"><span class="score" id="qs"></span><button class="btn ghost" id="qr" hidden>Try again</button></div>`;
  host.onclick = e => {
    const b = e.target.closest('.opt'); if (b) {
      const qd = b.closest('.q'); if (qd.dataset.done) return; qd.dataset.done = 1; const q = qs[+qd.dataset.i]; const j = +b.dataset.j;
      $$('.opt', qd).forEach((x, k) => { x.disabled = true; if (k === q.a) x.classList.add('right'); });
      if (j === q.a) score++; else b.classList.add('wrong');
      const w = $('.why', qd); w.hidden = false; w.textContent = (j === q.a ? '✔ ' : '✘ ') + q.e;

  };
}

    });
  } else if (kind === 'sed') {
    body.innerHTML = `<div class="pg"><div><label>sed expression (include -n / -E options if needed)</label><input type="text" id="pgexp" value="s/apple/mango/g" spellcheck="false"><div class="chips">${PG.sed.presets.map(p => `<button class="chip" data-p="${esc(p[0])}" title="${esc(p[1])}">${esc(p[0])}</button>`).join('')}</div><label>Input</label>${sampleBtns}<textarea id="pgin">${esc(SAMPLE.text)}</textarea></div><div><label>Output</label><div class="out" id="pgout"></div><div class="why" id="pgcmd"></div></div></div>`;
    wire(() => {
      let e = $('#pgexp').value.trim(); let n = false, ere = false; let guard = 0;
      while (/^-[nEr]+\s+/.test(e) && guard++ < 3) { const mm = /^-([nEr]+)\s+/.exec(e); if (mm[1].includes('n')) n = true; if (/[Er]/.test(mm[1])) ere = true; e = e.slice(mm[0].length); }
      if ((e.startsWith("'") && e.endsWith("'")) || (e.startsWith('"') && e.endsWith('"'))) e = e.slice(1, -1);
      try { $('#pgout').textContent = sedRun(e, $('#pgin').value, { n, ere }) || '(empty output)'; } catch (err) { $('#pgout').innerHTML = '<span class="e">' + esc('sed: ' + err.message) + '</span>'; }
      $('#pgcmd').innerHTML = `Equivalent: <code>sed ${n ? '-n ' : ''}${ere ? '-E ' : ''}'${esc(e)}' file</code>`;
    });
  } else if (kind === 'awk') {
    body.innerHTML = `<div class="pg"><div><label>awk program</label><textarea id="pgexp" style="min-height:90px" spellcheck="false">{print $1, $NF}</textarea><div class="chips">${PG.awk.presets.map(p => `<button class="chip" data-p="${esc(p[0])}" title="${esc(p[1])}">${esc(p[1])}</button>`).join('')}</div><label>Field separator (-F)</label><input type="text" id="pgfs" value="" placeholder="default: whitespace — e.g. , or :" spellcheck="false"><label>Input</label>${sampleBtns}<textarea id="pgin">${esc(SAMPLE.text)}</textarea></div><div><label>Output</label><div class="out" id="pgout"></div><div class="why" id="pgcmd"></div></div></div>`;
    wire(() => { const prog_ = $('#pgexp').value, fs = $('#pgfs').value; try { const r = awkRun(prog_, $('#pgin').value, { FS: fs || ' ' }); $('#pgout').textContent = r.out || '(empty output)'; } catch (err) { $('#pgout').innerHTML = '<span class="e">' + esc('awk: ' + err.message) + '</span>'; } $('#pgcmd').innerHTML = `Equivalent: <code>awk ${fs ? '-F' + esc(fs) + ' ' : ''}'${esc(prog_)}' file</code>`; });
  } else {
    body.innerHTML = `<div class="pg"><div><label>Pattern</label><input type="text" id="pgexp" value="apple" spellcheck="false"><label>Options</label><div>${[['i', 'ignore case'], ['v', 'invert'], ['n', 'line numbers'], ['c', 'count'], ['o', 'only matching'], ['w', 'whole word'], ['E', 'extended regex']].map(o => `<label class="chk" style="display:inline-flex;text-transform:none;letter-spacing:0;font:inherit"><input type="checkbox" data-o="${o[0]}"> -${o[0]} <span style="color:var(--ink2)">${o[1]}</span></label>`).join('')}</div><label>Input</label>${sampleBtns}<textarea id="pgin">${esc(SAMPLE.text)}</textarea></div><div><label>Output</label><div class="out" id="pgout"></div><div class="why" id="pgcmd"></div></div></div>`;
    wire(() => { const opts = $$('[data-o]', body).filter(x => x.checked).map(x => '-' + x.dataset.o); const pat = $('#pgexp').value; const g = VirtualShell(); const r = g.C.grep([...opts, pat], $('#pgin').value, 'grep'); $('#pgout').innerHTML = esc(r.out || '') + (r.err ? '<span class="e">' + esc(r.err) + '</span>' : '') || '(no matches — exit status 1)'; $('#pgcmd').innerHTML = `Equivalent: <code>grep ${opts.join(' ')} '${esc(pat)}' file</code>  → exit status ${r.code || 0}`; });
  }
}

/* ---------- Flashcards ---------- */
let deck = [], di = 0, deckCh = 'all';
function vCards(m) {
  const all = []; CH.forEach(c => c.sections.forEach(s => (s.cmds || []).forEach(k => all.push({ ch: c.id, f: k[0], b: k[1], sec: s.h }))));
  const mk = () => { deck = all.filter(x => deckCh === 'all' || x.ch === deckCh).filter(x => !prog.cards[x.f] || deckCh !== 'all' || true); di = 0; };
  mk();
  m.innerHTML = `<div class="page"><div class="eyebrow">Memorise</div><h1>Command flashcards</h1><p class="lede">${all.length} cards. Flip with <kbd>Space</kbd>, mark with <kbd>→</kbd> (got it) or <kbd>←</kbd> (again).</p>
  <div class="row"><select id="deckCh" style="width:auto"><option value="all">All chapters</option>${CH.map(c => `<option value="${c.id}" ${deckCh === c.id ? 'selected' : ''}>${c.n}. ${esc(c.title)}</option>`).join('')}</select><label class="chk"><input type="checkbox" id="hideKnown"> hide known</label><button class="btn ghost" id="shuf">Shuffle</button><span class="badge" id="fcStat"></span></div>
  <div class="fc-wrap"><div class="fc" id="fc"><div class="fc-in"><div class="fc-face fc-front"><small>command</small><code id="fcF"></code></div><div class="fc-face fc-back"><small>what it does</small><div id="fcB"></div></div></div></div></div>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="fcAgain">← Again</button><button class="btn ghost" id="fcFlip">Flip</button><button class="btn" id="fcKnow">Got it →</button></div></div>`;
  const show = () => { const hide = $('#hideKnown').checked; let d = deck.filter(x => !hide || !prog.cards[x.f]); if (!d.length) { $('#fcF').textContent = '🎉 No cards left'; $('#fcB').textContent = 'Uncheck “hide known” to review again.'; $('#fcStat').textContent = ''; return; } di = ((di % d.length) + d.length) % d.length; const c = d[di]; $('#fc').classList.remove('flip'); $('#fcF').textContent = c.f; $('#fcB').innerHTML = esc(c.b) + `<div style="font:.75rem var(--sans);color:var(--ink2);margin-top:12px">${esc(c.sec)}</div>`; $('#fcStat').textContent = `${di + 1}/${d.length} · known ${deck.filter(x => prog.cards[x.f]).length}/${deck.length}`; show.cur = c; show.len = d.length; };
  $('#fc').onclick = () => $('#fc').classList.toggle('flip'); $('#fcFlip').onclick = () => $('#fc').classList.toggle('flip');
  $('#fcKnow').onclick = () => { if (show.cur) { prog.cards[show.cur.f] = true; save(); } di++; show(); };
  $('#fcAgain').onclick = () => { if (show.cur) { delete prog.cards[show.cur.f]; save(); } di++; show(); };
  $('#deckCh').onchange = e => { deckCh = e.target.value; mk(); show(); }; $('#hideKnown').onchange = () => { di = 0; show(); };
  $('#shuf').onclick = () => { deck.sort(() => Math.random() - .5); di = 0; show(); };
  window.__fckey = e => { if (route().view !== 'cards' || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return; if (e.code === 'Space') { e.preventDefault(); $('#fc').classList.toggle('flip'); } else if (e.key === 'ArrowRight') $('#fcKnow').click(); else if (e.key === 'ArrowLeft') $('#fcAgain').click(); };
  show();
}
document.addEventListener('keydown', e => window.__fckey && window.__fckey(e));

/* ---------- Cheat sheet ---------- */
function vCheat(m) {
  m.innerHTML = `<div class="page wide"><div class="row noprint" style="justify-content:space-between"><div><div class="eyebrow">Reference</div><h1>Cheat sheet</h1></div><button class="btn" id="prn">Print / save PDF</button></div><input class="search-in noprint" id="chq" placeholder="Filter commands…" autocomplete="off">
  <div class="cheat" id="cheat">${CH.map(c => `<section data-ch="${c.id}"><h3>${c.icon} ${c.n}. ${esc(c.title)}</h3><table>${c.sections.flatMap(s => s.cmds || []).map(k => `<tr><td><code>${esc(k[0])}</code></td><td>${esc(k[1])}</td></tr>`).join('')}</table></section>`).join('')}</div></div>`;
  $('#prn').onclick = () => window.print();
  $('#chq').oninput = e => { const q = e.target.value.toLowerCase(); $$('#cheat section').forEach(s => { let any = false; $$('tr', s).forEach(tr => { const ok = !q || tr.textContent.toLowerCase().includes(q); tr.style.display = ok ? '' : 'none'; if (ok) any = true; }); s.style.display = any ? '' : 'none'; }); };
}

/* ---------- Mixed quiz ---------- */
let mixN = 10;
function vQuiz(m) {
  m.innerHTML = `<div class="page"><div class="eyebrow">Test yourself</div><h1>Mixed quiz</h1><p class="lede">Random questions drawn from every chapter.</p><div class="row noprint">${[10, 20, 30].map(n => `<button class="btn ${n === mixN ? '' : 'ghost'}" data-n="${n}">${n} questions</button>`).join('')}<button class="btn ghost" id="again">Reshuffle</button></div><div id="mq" class="quiz"></div></div>`;
  const pool = CH.flatMap(c => c.quiz.map(q => ({ ...q, _c: c.title })));
  const qs = pool.sort(() => Math.random() - .5).slice(0, mixN);
  buildQuiz($('#mq'), qs, res => { const b = store.get('best', {}); b['n' + mixN] = Math.max(b['n' + mixN] || 0, res.score); store.set('best', b); });
  $$('[data-n]', m).forEach(b => b.onclick = () => { mixN = +b.dataset.n; vQuiz(m); }); $('#again').onclick = () => vQuiz(m);
}

/* ---------- Challenges ---------- */
function vChallenges(m) {
  const solved = Object.keys(prog.chal).length;
  m.innerHTML = `<div class="page"><div class="eyebrow">Hands-on</div><h1>Terminal challenges</h1><p class="lede">Each task is checked by comparing your command's output with the expected output — there are usually several valid solutions. ${solved}/${window.CHALLENGES.length} solved. If a challenge never turns green, use “Reset sandbox” (you may have edited a sample file).</p>
  ${window.CHALLENGES.map(c => `<div class="chal ${prog.chal[c.id] ? 'done' : ''}"><div class="num">${prog.chal[c.id] ? '✓' : c.id}</div><div style="flex:1"><p>${esc(c.t)}</p><div class="row"><button class="btn ghost" data-c="${c.id}">Start in terminal</button><span class="badge">${esc((CH.find(x => x.id === c.ch) || {}).title || '')}</span></div><details><summary>Hint</summary>${esc(c.hint)}<br><span style="opacity:.8">Solution: </span><details style="display:inline"><summary style="display:inline;cursor:pointer">reveal</summary><code>${esc(c.sol)}</code></details></details></div></div>`).join('')}</div>`;
  $$('[data-c]', m).forEach(b => b.onclick = () => { setActive(window.CHALLENGES.find(c => c.id === +b.dataset.c)); });
}

/* ================= Search palette ================= */
let index = null, palSel = 0, palRes = [];
function buildIndex() {
  index = [];
  CH.forEach(c => { c.sections.forEach(s => { index.push({ k: 'sec', t: s.h, sub: `Ch ${c.n} · ${c.title}`, txt: (s.h + ' ' + strip(s.html)).toLowerCase(), go: `ch/${c.id}/${s.id}` }); (s.cmds || []).forEach(k => index.push({ k: 'cmd', t: k[0], sub: k[1], txt: (k[0] + ' ' + k[1]).toLowerCase(), go: `ch/${c.id}/${s.id}`, cmd: true })); }); });
  LECT.forEach(w => w.lectures.forEach(l => l.items.forEach(it => index.push({ k: 'lec', t: it.x, sub: `Week ${w.week} · ${l.title} @ ${it.t}`, txt: (it.x + ' ' + l.title).toLowerCase(), go: 'map' }))));
}
function openPal() { if (!index) buildIndex(); $('#pal').classList.add('open'); const i = $('#palq'); i.value = ''; i.focus(); palSearch(''); }
function closePal() { $('#pal').classList.remove('open'); }
function palSearch(q) {
  q = q.toLowerCase().trim(); const toks = q.split(/\s+/).filter(Boolean);
  let res = index.map(e => { if (!toks.every(t => e.txt.includes(t))) return null; let sc = 0; const tl = e.t.toLowerCase(); toks.forEach(t => { if (tl === t) sc += 20; else if (tl.startsWith(t)) sc += 10; else if (tl.includes(t)) sc += 5; else sc += 1; }); sc += { cmd: 3, sec: 2, lec: 0 }[e.k]; return { e, sc }; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 14).map(x => x.e);
  if (!toks.length) res = CH.map(c => ({ k: 'sec', t: c.title, sub: `Chapter ${c.n} · ${c.weeks}`, go: 'ch/' + c.id }));
  palRes = res; palSel = 0;
  $('#palul').innerHTML = res.length ? res.map((e, i) => `<li data-i="${i}" class="${i === 0 ? 'sel' : ''}">${e.k === 'cmd' ? `<code>${esc(e.t)}</code>` : esc(e.t)}<small>${esc(e.sub)}</small></li>`).join('') : '<li>No results</li>';
}
function palGo(i) { const e = palRes[i]; if (!e) return; closePal(); go(e.go); }
function initPal() {
  $('#palq').addEventListener('input', e => palSearch(e.target.value));
  $('#palq').addEventListener('keydown', e => { const n = palRes.length; if (e.key === 'ArrowDown') { e.preventDefault(); palSel = (palSel + 1) % n; } else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = (palSel - 1 + n) % n; } else if (e.key === 'Enter') { palGo(palSel); return; } else if (e.key === 'Escape') { closePal(); return; } else return; $$('#palul li').forEach((li, i) => li.classList.toggle('sel', i === palSel)); const s = $('#palul li.sel'); if (s) s.scrollIntoView({ block: 'nearest' }); });
  $('#palul').addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) palGo(+li.dataset.i); });
  $('#pal').addEventListener('click', e => { if (e.target.id === 'pal') closePal(); });
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); } else if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openPal(); } else if (e.key === 'Escape') closePal(); else if (e.key === '`' && e.ctrlKey) { e.preventDefault(); openDock(!$('#dock').classList.contains('open')); } });
}

/* ================= Boot ================= */
function boot() {
  const setTheme = t => { document.documentElement.dataset.theme = t; $$('#themes button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); store.set('theme', t); };
  setTheme(store.get('theme', null) || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
  $$('#themes button').forEach(b => b.onclick = () => setTheme(b.dataset.t));
  $('#menuBtn').onclick = () => $('#side').classList.toggle('open');
  $('#searchBtn').onclick = openPal; $('#termBtn').onclick = () => openDock(!$('#dock').classList.contains('open'));
  initTerminal(); initPal(); render();
}
document.addEventListener('DOMContentLoaded', boot);
})();
</script></body></html>
